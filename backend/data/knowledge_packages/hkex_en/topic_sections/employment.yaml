# ABOUTME(en): Topic chapter template of the HKEX Aspect "Employment": governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: employment
  title: Employment
  headingLevel: 2
  reportSectionId: employment
  conciseDisclosure:
    id: employment.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this Aspect, write one coherent summary covering the policies and compliance on compensation and dismissal, recruitment and promotion, working hours, rest periods, equal opportunity, diversity, anti-discrimination and other benefits and welfare, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: employment.gov
    title: Governance
    pillar: governance
    headingLevel: 3
    blocks:
    - id: employment.gov_policy_and_compliance
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's policies and allocation of responsibility on compensation and dismissal, recruitment and promotion, working hours, rest periods, equal opportunity, diversity, anti-discrimination and other benefits and welfare, and its compliance with relevant laws and regulations (such as the Hong Kong Employment Ordinance, the Minimum Wage Ordinance and the Mainland Labour Contract Law) (Code Aspect B1 General Disclosure).
          noFactGuidance: |-
            When the user provides no policy or responsibility facts, describe in a measured, general register the management attention, compliance principles and allocation of responsibility a company of this industry and business type applies to this Aspect; do not name departments, policy titles, certifications or approval flows, and do not claim that a specific system exists or that compliance checks have been completed.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - employment.q_governance_roles
            - employment.q_governance_policies
            - employment.q_governance_certifications
        targetChars:
        - 120
        - 265
        standardDisclosureRequirementKeys:
        - employment.gov.general_disclosure_policies
        - employment.gov.general_disclosure_compliance
        simplifiedWritingGuidance:
        - |-
          State compliance with relevant laws and regulations only when the user explicitly provides it; otherwise do not write conclusions such as "no non-compliance was identified" or "no material breach".
        - |-
          Keep employee-related wording at the distance of a public report: no words such as discipline, obedience or surveillance, and do not present statutory minimums as achievements.
  - key: employment.strategy
    title: Strategy
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: employment.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's approach and targets on attracting and retaining talent, diversity and inclusion, and employee well-being.
          noFactGuidance: |-
            When the user provides no targets or plans, state that the company will keep attending to improvement directions and the setting of quantified targets for this Aspect as the business develops; do not invent target values, base years, deadlines or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - employment.q_strategy_content
        targetChars:
        - 85
        - 190
        standardDisclosureRequirementKeys:
        - employment.strategy.employment_direction
        simplifiedWritingGuidance:
        - |-
          Keep employee-related wording at the distance of a public report: no words such as discipline, obedience or surveillance, and do not present statutory minimums as achievements.
  - key: employment.iro
    title: Risk Management
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: employment.iro_practices
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's employment practices: recruitment and promotion, compensation and performance arrangements, working hours and leave, equal opportunity and anti-discrimination measures, and employee benefits.
          noFactGuidance: |-
            When the user provides no specific measures, describe only the management steps and directional arrangements common to this Aspect for the industry and business type; do not claim that the company has implemented specific measures, purchased equipment, engaged contractors or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - employment.q_employment_practices
            - employment.q_employee_benefits
        targetChars:
        - 120
        - 265
        standardDisclosureRequirementKeys:
        - employment.iro.employment_practices
        simplifiedWritingGuidance:
        - |-
          Keep employee-related wording at the distance of a public report: no words such as discipline, obedience or surveillance, and do not present statutory minimums as achievements.
        - |-
          Figures are carried by the KPI data table; this passage does not state emissions, consumption, ratios or reduction percentages.
metricDisclosure:
  catalogMetricKeys:
  - employment_total_workforce
  - employment_female
  - employment_male
  - employment_full_time
  - employment_part_time
  - employment_age_under_30
  - employment_age_30_50
  - employment_age_over_50
  - employment_region_hong_kong
  - employment_region_mainland
  - employment_region_other
  - employment_turnover_rate_total
  - employment_turnover_rate_female
  - employment_turnover_rate_male
  - employment_turnover_rate_under_30
  - employment_turnover_rate_30_50
  - employment_turnover_rate_over_50
