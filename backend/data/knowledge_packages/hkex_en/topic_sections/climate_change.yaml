# ABOUTME(en): Topic chapter template of the HKEX Aspect "Climate Change": governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
# Part D climate-related disclosures (paragraphs 16–41) are carried by governance / strategy / risk management / metrics and targets; Scope 1 and Scope 2 emissions are required disclosures for all issuers.
section:
  key: climate_change
  title: Climate Change
  headingLevel: 2
  reportSectionId: climate_change
  conciseDisclosure:
    id: climate.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this Aspect, write one coherent summary covering the main arrangements for climate-related governance, strategy, risk management and metrics and targets, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: climate_change.gov
    title: Governance
    pillar: governance
    headingLevel: 3
    blocks:
    - id: climate.gov_oversight
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the board's and management's oversight and management of climate-related risks and opportunities: the responsible governance body or position, its terms of reference and competence, how often it reports to the board, and how climate considerations enter decision-making (Code Part D paragraphs 19–20).
          noFactGuidance: |-
            When the user provides no climate governance facts, state that the board holds ultimate oversight of climate-related matters and that management handles day-to-day management and reporting; do not name committees, positions, frequencies or specific meetings.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - climate.q_governance_roles
            - climate.q_governance_policies
            - climate.q_governance_certifications
        targetChars:
        - 120
        - 250
        standardDisclosureRequirementKeys:
        - climate_change.gov.board_oversight
        - climate_change.gov.management_role
        simplifiedWritingGuidance:
        - |-
          The board-level oversight statement is carried by the "Board Statement"; this passage covers only the climate-specific governance arrangements.
  - key: climate_change.strategy
    title: Strategy
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: climate.strategy_risks_opportunities
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the physical and transition risks and the opportunities the company has identified, their potential effects on the business model, value chain and financial position over the short, medium and long term, and the company's response strategy and transition plan (Code Part D paragraphs 21–24).
          noFactGuidance: |-
            When the user provides no climate risk facts, describe only the directional effects of physical risks (such as extreme weather and heat) and transition risks (such as carbon pricing and customers' low-carbon requirements) common to the industry and business type, and the general response directions; do not claim that the company has identified or quantified them or has a transition plan.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - climate.q_strategy_content
            - climate.q_climate_risks
            - climate.q_climate_opportunities
            - climate.q_transition_plan
        targetChars:
        - 190
        - 420
        standardDisclosureRequirementKeys:
        - climate_change.strategy.risks_and_opportunities
        - climate_change.strategy.business_model_and_value_chain
        - climate_change.strategy.strategy_and_transition_plan
        - climate_change.strategy.financial_effects
        simplifiedWritingGuidance:
        - |-
          Write financial effects as figures only when the user provides quantitative data; otherwise describe the direction of the effect qualitatively and, where appropriate, note that the company is assessing it.
        - |-
          Figures are carried by the KPI data table; this passage does not state emissions, consumption, ratios or reduction percentages.
    - id: climate.strategy_resilience
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's assessment of the climate resilience of its strategy and business model, including whether scenario analysis is used, the scenarios and assumptions considered, and the conclusions (Code Part D paragraphs 25–26).
          noFactGuidance: |-
            When the user provides no resilience assessment facts, state that the company will develop its climate resilience assessment in step with the Code's implementation arrangements; do not claim that scenario analysis has been completed or conclusions reached.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - climate.q_scenario_analysis
        targetChars:
        - 85
        - 190
        standardDisclosureRequirementKeys:
        - climate_change.strategy.climate_resilience
    - id: climate.strategy_targets
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the climate-related targets the company has set (such as greenhouse gas reduction targets), the scope they cover, the base year, the target year, and the steps and progress towards them (Code Part D paragraphs 33–35).
          noFactGuidance: |-
            When the user provides no targets or plans, state that the company will keep attending to improvement directions and the setting of quantified targets for this Aspect as the business develops; do not invent target values, base years, deadlines or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - climate.q_strategy_content
            - climate.q_climate_targets
        targetChars:
        - 95
        - 215
        standardDisclosureRequirementKeys:
        - climate_change.strategy.climate_targets
  - key: climate_change.iro
    title: Risk Management
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: climate.iro_risk_management_process
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the process by which the company identifies, assesses, prioritises and monitors climate-related risks and opportunities, and how that process is integrated into overall risk management (Code Part D paragraph 27).
          noFactGuidance: |-
            When the user provides no risk management process facts, state that the company attends to the identification and assessment of climate-related risks within its overall risk management framework; do not claim a dedicated process, a review frequency or completed prioritisation.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - climate.q_climate_risks
            - climate.q_risk_management_process
        targetChars:
        - 110
        - 240
        standardDisclosureRequirementKeys:
        - climate_change.iro.risk_management_process
metricDisclosure:
  catalogMetricKeys:
  - climate_ghg_scope1
  - climate_ghg_scope2
  - climate_ghg_scope1_2_total
  - climate_ghg_scope3
  - climate_ghg_intensity_revenue
  - climate_ghg_intensity_output
  - climate_internal_carbon_price
  - climate_capital_deployment
