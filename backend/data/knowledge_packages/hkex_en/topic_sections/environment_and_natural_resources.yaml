# ABOUTME(en): Topic chapter template of the HKEX Aspect "The Environment and Natural Resources": governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: environment_and_natural_resources
  title: The Environment and Natural Resources
  headingLevel: 2
  reportSectionId: environment_and_natural_resources
  conciseDisclosure:
    id: natural_resources.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this Aspect, write one coherent summary covering the policy on minimising significant impacts on the environment and natural resources, the impacts identified and the actions taken, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: environment_and_natural_resources.gov
    title: Governance
    pillar: governance
    headingLevel: 3
    blocks:
    - id: natural_resources.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's policy on minimising the significant impacts of its operations on the environment and natural resources and the allocation of responsibility (Code Aspect A3 General Disclosure).
          noFactGuidance: |-
            When the user provides no policy or responsibility facts, describe in a measured, general register the management attention, compliance principles and allocation of responsibility a company of this industry and business type applies to this Aspect; do not name departments, policy titles, certifications or approval flows, and do not claim that a specific system exists or that compliance checks have been completed.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - natural_resources.q_governance_roles
            - natural_resources.q_governance_policies
            - natural_resources.q_governance_certifications
        targetChars:
        - 85
        - 190
        standardDisclosureRequirementKeys:
        - environment_and_natural_resources.gov.general_disclosure_policies
  - key: environment_and_natural_resources.strategy
    title: Strategy
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: natural_resources.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's long-term direction and principles on environmental protection and natural resource management, including its consideration of land use, biodiversity and raw material sourcing.
          noFactGuidance: |-
            When the user provides no targets or plans, state that the company will keep attending to improvement directions and the setting of quantified targets for this Aspect as the business develops; do not invent target values, base years, deadlines or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - natural_resources.q_strategy_content
        targetChars:
        - 85
        - 190
        standardDisclosureRequirementKeys:
        - environment_and_natural_resources.strategy.environmental_direction
  - key: environment_and_natural_resources.iro
    title: Risk Management
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: natural_resources.iro_impacts_and_actions
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the significant impacts of the company's activities on the environment and natural resources and the actions taken to manage them (Code KPI A3.1).
          noFactGuidance: |-
            When the user provides no specific measures, describe only the management steps and directional arrangements common to this Aspect for the industry and business type; do not claim that the company has implemented specific measures, purchased equipment, engaged contractors or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - natural_resources.q_significant_impacts
            - natural_resources.q_mitigation_actions
        targetChars:
        - 110
        - 240
        standardDisclosureRequirementKeys:
        - environment_and_natural_resources.iro.significant_impacts_and_actions
metricDisclosure:
  catalogMetricKeys: []
