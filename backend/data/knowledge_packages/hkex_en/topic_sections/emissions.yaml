# ABOUTME(en): Topic chapter template of the HKEX Aspect "Emissions": governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: emissions
  title: Emissions
  headingLevel: 2
  reportSectionId: emissions
  conciseDisclosure:
    id: emissions.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this Aspect, write one coherent summary covering the policies, compliance, targets and measures for air and greenhouse gas emissions and discharges into water and land, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: emissions.gov
    title: Governance
    pillar: governance
    headingLevel: 3
    blocks:
    - id: emissions.gov_policy_and_compliance
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's policies and allocation of responsibility on air and greenhouse gas emissions and discharges into water and land, and its compliance with relevant laws and regulations that have a significant impact on the company (Code Aspect A1 General Disclosure).
          noFactGuidance: |-
            When the user provides no policy or responsibility facts, describe in a measured, general register the management attention, compliance principles and allocation of responsibility a company of this industry and business type applies to this Aspect; do not name departments, policy titles, certifications or approval flows, and do not claim that a specific system exists or that compliance checks have been completed.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - emissions.q_governance_roles
            - emissions.q_governance_policies
            - emissions.q_governance_certifications
        targetChars:
        - 110
        - 240
        standardDisclosureRequirementKeys:
        - emissions.gov.general_disclosure_policies
        - emissions.gov.general_disclosure_compliance
        simplifiedWritingGuidance:
        - |-
          State compliance with relevant laws and regulations only when the user explicitly provides it; otherwise do not write conclusions such as "no non-compliance was identified" or "no material breach".
  - key: emissions.strategy
    title: Strategy
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: emissions.strategy_targets
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the emission targets the company has set and the steps taken to achieve them, including the emission types covered, the direction and the implementation arrangements (Code KPI A1.5).
          noFactGuidance: |-
            When the user provides no targets or plans, state that the company will keep attending to improvement directions and the setting of quantified targets for this Aspect as the business develops; do not invent target values, base years, deadlines or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - emissions.q_strategy_content
            - emissions.q_emission_reduction_measures
        targetChars:
        - 95
        - 215
        standardDisclosureRequirementKeys:
        - emissions.strategy.emission_targets
        simplifiedWritingGuidance:
        - |-
          Figures are carried by the KPI data table; this passage does not state emissions, consumption, ratios or reduction percentages.
  - key: emissions.iro
    title: Risk Management
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: emissions.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe how the company identifies its main emission sources and controls emissions: exhaust gas treatment, wastewater treatment and discharge, monitoring and testing arrangements, and cooperation with licensed contractors or regulators.
          noFactGuidance: |-
            When the user provides no specific measures, describe only the management steps and directional arrangements common to this Aspect for the industry and business type; do not claim that the company has implemented specific measures, purchased equipment, engaged contractors or achieved results.
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - emissions.q_emission_sources
            - emissions.q_emission_reduction_measures
        targetChars:
        - 120
        - 250
        standardDisclosureRequirementKeys:
        - emissions.iro.emission_control_measures
        simplifiedWritingGuidance:
        - |-
          Figures are carried by the KPI data table; this passage does not state emissions, consumption, ratios or reduction percentages.
metricDisclosure:
  catalogMetricKeys:
  - emissions_nox
  - emissions_sox
  - emissions_pm
  - emissions_voc
  - emissions_wastewater_discharge
  - emissions_cod
