# ABOUTME(en): Appendix C2 disclosure requirements of "Health and Safety" (General Disclosure and KPIs), grouped by pillar,
# ABOUTME(en): for the coverage audit and for prompt assembly by key whitelist (injection is switch-gated, off by default) and for the coverage audit. Wording follows the English Code text.
topicStandardDisclosureRequirementGroups:
- topicSectionKey: health_and_safety.gov
  pillar: governance
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: health_and_safety.gov.general_disclosure_policies
    standardDisclosureRequirementTitle: Occupational health and safety policies
    excerptFrom: HKEX·Appendix C2·General Disclosure B2
    standardDisclosureRequirementText: |-
      Disclose the policies on providing a safe working environment and protecting employees from occupational hazards.
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: General Disclosure B2
  - standardDisclosureRequirementKey: health_and_safety.gov.general_disclosure_compliance
