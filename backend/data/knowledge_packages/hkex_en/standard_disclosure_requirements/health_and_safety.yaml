    excerptFrom: HKEX·Appendix C2·General Disclosure B2
    standardDisclosureRequirementText: |-
      Disclose information on compliance with occupational safety and health laws and regulations that have a significant impact on the issuer.
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: General Disclosure B2
