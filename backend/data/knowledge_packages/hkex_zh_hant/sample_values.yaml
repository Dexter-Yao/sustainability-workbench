  company_profile: 晉澧精密工業控股有限公司是在香港聯合交易所主板上市的精密製造企業，總部位於香港觀塘，生產基地位於廣東東莞，主要從事精密金屬沖壓件、連接器及組裝模組的研發、製造及銷售，客戶涵蓋消費電子、工業設備及新能源汽車零部件領域。公司建立了涵蓋研發、生產、品質及客戶服務的業務體系，持續推進自動化製造、節能減排及供應鏈協同，重視僱員發展、產品責任及社區參與，致力為客戶、股東及社會創造長期價值。
  business_summary: 公司是香港主板上市的精密製造企業，主要從事精密金屬沖壓件、連接器及組裝模組的研發、製造及銷售，客戶涵蓋消費電子、工業設備及新能源汽車零部件領域。
  intake:
    board_statement.q_oversight:
      answer: 董事會對環境、社會及管治事宜負最終責任，每年至少兩次審議相關風險、目標及進展；環境、社會及管治工作小組由執行董事牽頭，向董事會匯報。
    board_statement.q_management_approach:
      answer: 董事會確立以合規營運、綠色製造及以人為本為主軸的管理方針；重要議題透過年度持份者問卷及管理層評估識別及排序，並按對業務及持份者的重要性釐定披露重點。
    board_statement.q_progress_review:
      answer: 董事會每年檢討能源密度、溫室氣體排放密度及工傷率等目標的進展，並按業務發展調整目標。
    sustainability_governance_structure:
      answer: 公司設有由執行董事牽頭的環境、社會及管治工作小組，成員包括財務、人力資源、生產、品質及採購部門主管；各部門指派聯絡人負責數據收集。
    sustainability_governance_duties:
      answer: 董事會負責監管及審批；工作小組統籌重要性評估、目標訂立及報告編製；各部門落實措施並按季度提交數據。
    climate.q_governance_roles:
      answer: 設有專責部門或崗位負責
      supplement: 環境、社會及管治工作小組統籌氣候相關事宜，生產部門負責能源及排放數據。
    climate.q_strategy_content:
      answer: 公司訂立以2023年為基準年、於2030年將範圍1及範圍2溫室氣體排放密度降低30%的目標，主要透過廠房屋頂太陽能光伏、設備能效提升及購買可再生能源電力推進。
