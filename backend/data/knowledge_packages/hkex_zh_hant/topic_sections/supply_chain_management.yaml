# ABOUTME(en): Topic chapter template of the HKEX Aspect「供應鏈管理」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: supply_chain_management
  title: 供應鏈管理
  headingLevel: 2
  reportSectionId: supply_chain_management
  conciseDisclosure:
    id: supply_chain.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: 根據本層面當前可見證據形成一段連貫摘要，涵蓋管理供應鏈環境及社會風險的政策、供應商參與慣例、風險識別及環保產品採購的做法，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: supply_chain_management.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: supply_chain.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司管理供應鏈環境及社會風險的政策與職責安排（守則層面B5一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - supply_chain.q_governance_roles
            - supply_chain.q_governance_policies
            - supply_chain.q_governance_certifications
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - supply_chain_management.gov.general_disclosure_policies
  - key: supply_chain_management.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: supply_chain.strategy_green_procurement
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司在挑選供應商時促使多用環保產品及服務的慣例，以及供應鏈可持續發展的方向（守則關鍵績效指標B5.4）。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - supply_chain.q_strategy_content
            - supply_chain.q_green_procurement
        targetChars:
        - 140
        - 340
        standardDisclosureRequirementKeys:
        - supply_chain_management.strategy.green_procurement
  - key: supply_chain_management.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: supply_chain.iro_engagement_and_risk
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            描述公司聘用供應商的慣例（篩選、評核、行為守則簽署、審核）、向其執行有關慣例的供應商情況，以及識別供應鏈每個環節環境及社會風險的慣例與監察方法（守則關鍵績效指標B5.2及B5.3）。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - supply_chain.q_supplier_engagement
            - supply_chain.q_supplier_esg_risk
        targetChars:
        - 220
        - 480
        standardDisclosureRequirementKeys:
        - supply_chain_management.iro.supplier_engagement
        - supply_chain_management.iro.supply_chain_risk_identification
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
metricDisclosure:
  catalogMetricKeys:
  - supply_chain_suppliers_total
  - supply_chain_suppliers_hong_kong
  - supply_chain_suppliers_mainland
  - supply_chain_suppliers_other
  - supply_chain_suppliers_assessed
