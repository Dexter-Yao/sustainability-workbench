# ABOUTME(en): Topic chapter template of the HKEX Aspect「僱傭」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: employment
  title: 僱傭
  headingLevel: 2
  reportSectionId: employment
  conciseDisclosure:
    id: employment.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          根據本層面當前可見證據形成一段連貫摘要，涵蓋薪酬及解僱、招聘及晉升、工作時數、假期、平等機會、多元化、反歧視及其他待遇及福利的政策與合規情況，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: employment.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: employment.gov_policy_and_compliance
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            說明公司有關薪酬及解僱、招聘及晉升、工作時數、假期、平等機會、多元化、反歧視以及其他待遇及福利的政策與職責安排，以及遵守相關法律及規例（如香港《僱傭條例》、《最低工資條例》、內地《勞動合同法》）的情況（守則層面B1一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - employment.q_governance_roles
            - employment.q_governance_policies
            - employment.q_governance_certifications
        targetChars:
        - 200
        - 440
        standardDisclosureRequirementKeys:
        - employment.gov.general_disclosure_policies
        - employment.gov.general_disclosure_compliance
        simplifiedWritingGuidance:
        - 遵守相關法律及規例的情況只在用戶明確提供時陳述；未提供時不寫「未發現違規」或「無重大違規」等結論。
        - 僱員相關表述保持公開報告的距離：不寫懲處、服從、監控等字眼，不把法定最低要求寫成成就。
  - key: employment.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: employment.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司在人才吸引與保留、多元共融及僱員福祉方面的管理方針與目標。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - employment.q_strategy_content
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - employment.strategy.employment_direction
        simplifiedWritingGuidance:
        - 僱員相關表述保持公開報告的距離：不寫懲處、服從、監控等字眼，不把法定最低要求寫成成就。
  - key: employment.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: employment.iro_practices
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司的僱傭實務：招聘與晉升機制、薪酬與績效安排、工作時數及假期管理、平等機會與反歧視措施，以及僱員福利。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - employment.q_employment_practices
            - employment.q_employee_benefits
        targetChars:
        - 200
        - 440
        standardDisclosureRequirementKeys:
        - employment.iro.employment_practices
        simplifiedWritingGuidance:
        - 僱員相關表述保持公開報告的距離：不寫懲處、服從、監控等字眼，不把法定最低要求寫成成就。
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
