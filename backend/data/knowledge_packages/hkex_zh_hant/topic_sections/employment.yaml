  - employment_age_over_50
  - employment_region_hong_kong
  - employment_region_mainland
  - employment_region_other
  - employment_turnover_rate_total
  - employment_turnover_rate_female
  - employment_turnover_rate_male
  - employment_turnover_rate_under_30
  - employment_turnover_rate_30_50
  - employment_turnover_rate_over_50
