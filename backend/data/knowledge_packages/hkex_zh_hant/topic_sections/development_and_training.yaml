# ABOUTME(en): Topic chapter template of the HKEX Aspect「發展及培訓」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: development_and_training
  title: 發展及培訓
  headingLevel: 2
  reportSectionId: development_and_training
  conciseDisclosure:
    id: training.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: 根據本層面當前可見證據形成一段連貫摘要，涵蓋提升僱員履行工作職責的知識及技能的政策、培訓活動及方向，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: development_and_training.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: training.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司有關提升僱員履行工作職責的知識及技能的政策與職責安排（守則層面B3一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - training.q_governance_roles
            - training.q_governance_policies
            - training.q_governance_certifications
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - development_and_training.gov.general_disclosure_policies
  - key: development_and_training.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: training.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司在人才發展方面的方針與目標：培訓需求識別、能力發展路徑及重點培訓領域。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - training.q_strategy_content
            - training.q_training_needs
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - development_and_training.strategy.training_direction
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
  - key: development_and_training.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: training.iro_programmes
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 描述公司於匯報期間開展的培訓活動：入職培訓、專業技能、管理能力、安全及合規培訓，以及培訓的組織與評估方式。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - training.q_training_programmes
        targetChars:
        - 180
        - 400
        standardDisclosureRequirementKeys:
        - development_and_training.iro.training_activities
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
metricDisclosure:
