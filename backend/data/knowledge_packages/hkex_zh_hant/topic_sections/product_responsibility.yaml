# ABOUTME(en): Topic chapter template of the HKEX Aspect「產品責任」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: product_responsibility
  title: 產品責任
  headingLevel: 2
  reportSectionId: product_responsibility
  conciseDisclosure:
    id: product.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          根據本層面當前可見證據形成一段連貫摘要，涵蓋產品及服務的健康與安全、廣告、標籤及補救方法的政策與合規情況、質量檢定及回收程序、知識產權保護，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: product_responsibility.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: product.gov_policy_and_compliance
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            說明公司有關所提供產品及服務的健康與安全、廣告、標籤及補救方法的政策、職責安排及認證（如ISO 9001），以及遵守相關法律及規例的情況（守則層面B6一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - product.q_governance_roles
            - product.q_governance_policies
            - product.q_governance_certifications
        targetChars:
        - 200
        - 440
        standardDisclosureRequirementKeys:
        - product_responsibility.gov.general_disclosure_policies
        - product_responsibility.gov.general_disclosure_compliance
        simplifiedWritingGuidance:
        - 遵守相關法律及規例的情況只在用戶明確提供時陳述；未提供時不寫「未發現違規」或「無重大違規」等結論。
  - key: product_responsibility.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: product.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司在產品質量與客戶服務方面的方針、目標及廣告與標籤的合規原則。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - product.q_strategy_content
            - product.q_advertising_labelling
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - product_responsibility.strategy.quality_direction
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
  - key: product_responsibility.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: product.iro_quality_and_recall
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 描述公司的質量檢定過程及產品回收程序，以及處理客戶投訴的方法（守則關鍵績效指標B6.2及B6.4）。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - product.q_quality_assurance
            - product.q_recall_procedure
        targetChars:
        - 200
        - 440
        standardDisclosureRequirementKeys:
        - product_responsibility.iro.quality_assurance_and_recall
        - product_responsibility.iro.complaints_handling
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
    - id: product.iro_intellectual_property
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 描述公司維護及保障知識產權的慣例：專利與商標管理、保密安排及對客戶知識產權的尊重（守則關鍵績效指標B6.3）。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - product.q_ip_practices
        targetChars:
        - 120
        - 280
        standardDisclosureRequirementKeys:
        - product_responsibility.iro.intellectual_property
metricDisclosure:
  catalogMetricKeys:
  - product_recall_rate
  - product_complaints
  - product_complaints_resolved_rate
