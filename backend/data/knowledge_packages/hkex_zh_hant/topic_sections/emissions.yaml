# ABOUTME(en): Topic chapter template of the HKEX Aspect「排放物」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: emissions
  title: 排放物
  headingLevel: 2
  reportSectionId: emissions
  conciseDisclosure:
    id: emissions.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: 根據本層面當前可見證據形成一段連貫摘要，涵蓋廢氣及溫室氣體排放、排放至水體及土地的管理方針、合規情況、目標及措施，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: emissions.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: emissions.gov_policy_and_compliance
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司有關廢氣及溫室氣體排放、向水及土地的排污的政策、職責安排，以及遵守對公司有重大影響的相關法律及規例的情況（守則層面A1一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - emissions.q_governance_roles
            - emissions.q_governance_policies
            - emissions.q_governance_certifications
        targetChars:
        - 180
        - 400
        standardDisclosureRequirementKeys:
        - emissions.gov.general_disclosure_policies
        - emissions.gov.general_disclosure_compliance
        simplifiedWritingGuidance:
        - 遵守相關法律及規例的情況只在用戶明確提供時陳述；未提供時不寫「未發現違規」或「無重大違規」等結論。
  - key: emissions.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: emissions.strategy_targets
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司訂立的排放量目標及為達到目標所採取的步驟，包括目標涵蓋的排放類型、方向及推進安排（守則關鍵績效指標A1.5）。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - emissions.q_strategy_content
            - emissions.q_emission_reduction_measures
        targetChars:
        - 160
        - 360
        standardDisclosureRequirementKeys:
        - emissions.strategy.emission_targets
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
  - key: emissions.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: emissions.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司識別主要排放源及控制排放的措施：廢氣處理、廢水處理及排放、監測與檢測安排，以及與持牌承辦商或監管機構的配合。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - emissions.q_emission_sources
            - emissions.q_emission_reduction_measures
        targetChars:
        - 200
        - 420
        standardDisclosureRequirementKeys:
        - emissions.iro.emission_control_measures
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
metricDisclosure:
  catalogMetricKeys:
  - emissions_nox
  - emissions_sox
  - emissions_pm
  - emissions_voc
  - emissions_wastewater_discharge
  - emissions_cod
