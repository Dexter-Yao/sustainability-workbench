# ABOUTME(en): Topic chapter template of the HKEX Aspect「環境及天然資源」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: environment_and_natural_resources
  title: 環境及天然資源
  headingLevel: 2
  reportSectionId: environment_and_natural_resources
  conciseDisclosure:
    id: natural_resources.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: 根據本層面當前可見證據形成一段連貫摘要，涵蓋公司減低對環境及天然資源重大影響的政策、已識別的影響及管理行動，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: environment_and_natural_resources.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: natural_resources.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司減低營運對環境及天然資源造成重大影響的政策與職責安排（守則層面A3一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - natural_resources.q_governance_roles
            - natural_resources.q_governance_policies
            - natural_resources.q_governance_certifications
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - environment_and_natural_resources.gov.general_disclosure_policies
  - key: environment_and_natural_resources.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: natural_resources.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司在環境保護及天然資源管理方面的長期方向與原則，包括對土地使用、生物多樣性及原材料來源的考慮。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - natural_resources.q_strategy_content
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - environment_and_natural_resources.strategy.environmental_direction
  - key: environment_and_natural_resources.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: natural_resources.iro_impacts_and_actions
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司業務活動對環境及天然資源的重大影響及已採取的管理行動（守則關鍵績效指標A3.1）。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - natural_resources.q_significant_impacts
            - natural_resources.q_mitigation_actions
        targetChars:
        - 180
        - 400
        standardDisclosureRequirementKeys:
        - environment_and_natural_resources.iro.significant_impacts_and_actions
metricDisclosure:
  catalogMetricKeys: []
