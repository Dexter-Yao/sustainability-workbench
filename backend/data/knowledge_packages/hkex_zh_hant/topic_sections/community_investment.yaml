# ABOUTME(en): Topic chapter template of the HKEX Aspect「社區投資」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: community_investment
  title: 社區投資
  headingLevel: 2
  reportSectionId: community_investment
  conciseDisclosure:
    id: community_investment.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: 根據本層面當前可見證據形成一段連貫摘要，涵蓋以社區參與了解營運所在社區需要的政策、專注貢獻範疇及所動用資源，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: community_investment.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: community_investment.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司有關以社區參與來了解營運所在社區需要及確保業務活動考慮社區利益的政策與職責安排（守則層面B8一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - community_investment.q_governance_roles
            - community_investment.q_governance_policies
            - community_investment.q_governance_certifications
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - community_investment.gov.general_disclosure_policies
  - key: community_investment.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: community_investment.strategy_focus_areas
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司的專注貢獻範疇（如教育、環境、勞工需求、健康、文化、體育）及社區投資的方向（守則關鍵績效指標B8.1）。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - community_investment.q_strategy_content
            - community_investment.q_focus_areas
        targetChars:
        - 140
        - 320
        standardDisclosureRequirementKeys:
        - community_investment.strategy.focus_areas
  - key: community_investment.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: community_investment.iro_activities
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 描述公司於匯報期間開展的社區參與及公益活動、與社區組織的合作，以及所動用的資源類型（如捐款或義工時間）（守則關鍵績效指標B8.2）。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - community_investment.q_community_activities
            - community_investment.q_focus_areas
        targetChars:
        - 160
        - 380
        standardDisclosureRequirementKeys:
        - community_investment.iro.community_activities
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
metricDisclosure:
  catalogMetricKeys:
  - community_donations
  - community_volunteer_hours
  - community_volunteer_participants
