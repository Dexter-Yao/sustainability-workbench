# ABOUTME(en): Topic chapter template of the HKEX Aspect「能源管理」: governance / strategy / risk-management
# ABOUTME(en): blocks with their intake evidence and Appendix C2 requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: energy_management
  title: 能源管理
  headingLevel: 2
  reportSectionId: energy_management
  conciseDisclosure:
    id: energy.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: 根據本層面當前可見證據形成一段連貫摘要，涵蓋能源使用政策、能源效益目標及措施，不使用四項小標題。
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: energy_management.gov
    title: 管治
    pillar: governance
    headingLevel: 3
    blocks:
    - id: energy.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司有效使用能源的政策、職責安排及能源管理相關認證（守則層面A2一般披露）。
          noFactGuidance: |-
            用戶未提供政策或職責資料時，以審慎、概括的語態說明公司按所屬行業及業務類型對本層面採取的一般管理關注、合規原則及職責安排；不指名部門、制度名稱、認證或審批流程，不聲稱已建立特定制度或已完成合規檢查。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - energy.q_governance_roles
            - energy.q_governance_policies
            - energy.q_governance_certifications
        targetChars:
        - 160
        - 360
        standardDisclosureRequirementKeys:
        - energy_management.gov.general_disclosure_policies
  - key: energy_management.strategy
    title: 策略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: energy.strategy_targets
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司訂立的能源使用效益目標及為達到目標所採取的步驟，包括設備能效提升、可再生能源使用及管理措施的方向（守則關鍵績效指標A2.3）。
          noFactGuidance: 用戶未提供目標或計劃時，說明公司會結合業務發展持續關注本層面的改善方向與量化目標的訂立；不虛構目標數值、基準年、達成期限或已取得的成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - energy.q_strategy_content
            - energy.q_renewable_energy
        targetChars:
        - 160
        - 360
        standardDisclosureRequirementKeys:
        - energy_management.strategy.energy_efficiency_targets
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
  - key: energy_management.iro
    title: 風險管理
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: energy.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: 說明公司提升能源效益的具體措施：高耗能設備更新、照明及空調節能、生產排程優化、能源監測及可再生能源使用的安排。
          noFactGuidance: 用戶未提供具體措施時，僅結合行業及業務類型說明本層面常見的管理環節與方向性安排；不聲稱公司已實施特定措施、已購置設備、已委聘服務商或已取得成效。
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - energy.q_energy_efficiency_measures
            - energy.q_renewable_energy
        targetChars:
        - 180
        - 400
        standardDisclosureRequirementKeys:
        - energy_management.iro.energy_efficiency_measures
        simplifiedWritingGuidance:
        - 數值由關鍵績效指標數據表承載；本段不寫排放量、耗用量、比率或減幅等數字。
metricDisclosure:
