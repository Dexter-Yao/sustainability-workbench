  - {id: supplier_grievance_feedback, label: 申訴反饋, kind: participation_mechanism, allowedStakeholderTypes: [suppliers]}
  - {id: capability_building, label: 能力建設, kind: collaboration_activity, allowedStakeholderTypes: [suppliers]}
