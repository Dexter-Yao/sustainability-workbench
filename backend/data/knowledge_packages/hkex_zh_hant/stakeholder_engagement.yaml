  - {id: opinion_channels, label: 意見渠道, kind: communication_channel, allowedStakeholderTypes: [employees]}
  - {id: grievance_feedback, label: 申訴及反饋, kind: participation_mechanism, allowedStakeholderTypes: [employees]}
