# ABOUTME(en): Deterministic stakeholder engagement catalog of the HKEX package: stable stakeholder types,
# ABOUTME(en): engagement methods and the default topic ↔ stakeholder mapping. Topic names and applicability
# ABOUTME(en): stay with topic_registry.yaml; this file only references official topic ids.

stakeholders:
  - id: government_regulators
    label: 政府及監管機構
    order: 10
    defaultMethodIds: [regulatory_communication, document_submission_correspondence, supervision_inspection_support]
  - id: shareholders_investors
    label: 股東及投資者
    order: 20
    defaultMethodIds: [shareholder_meeting, information_disclosure, investor_communication]
  - id: customers
    label: 客戶
    order: 30
    defaultMethodIds: [customer_visits, customer_service_channels, satisfaction_survey, complaints_feedback]
  - id: management
    label: 管理層
    order: 40
    defaultMethodIds: [management_meeting, special_reporting, issue_review_decision]
  - id: employees
    label: 僱員
    order: 50
    defaultMethodIds: [employee_representative_communication, employee_forum, opinion_channels, training]
  - id: suppliers
    label: 供應商
    order: 60
    defaultMethodIds: [supplier_meeting, daily_business_communication, supplier_admission_evaluation, supply_chain_collaborative_improvement]
  - id: partners
    label: 業務夥伴
    order: 70
    defaultMethodIds: [business_meeting, industry_exchange, joint_working_group, project_cooperation]
  - id: community_public
    label: 社區及公眾
    order: 80
    defaultMethodIds: [community_visits, public_consultation, opinion_solicitation, community_co_creation]

methods:
  - {id: regulatory_communication, label: 監管溝通, kind: communication_channel, allowedStakeholderTypes: [government_regulators]}
  - {id: document_submission_correspondence, label: 文件呈交及函件往來, kind: communication_channel, allowedStakeholderTypes: [government_regulators]}
  - {id: policy_briefing_roundtable, label: 政策簡介會及專題座談, kind: participation_mechanism, allowedStakeholderTypes: [government_regulators]}
  - {id: supervision_inspection_support, label: 配合監督檢查, kind: participation_mechanism, allowedStakeholderTypes: [government_regulators]}
  - {id: government_enterprise_exchange, label: 政企交流, kind: collaboration_activity, allowedStakeholderTypes: [government_regulators]}

  - {id: shareholder_meeting, label: 股東大會, kind: communication_channel, allowedStakeholderTypes: [shareholders_investors]}
  - {id: information_disclosure, label: 公告及資料披露, kind: communication_channel, allowedStakeholderTypes: [shareholders_investors]}
  - {id: investor_communication, label: 投資者溝通, kind: communication_channel, allowedStakeholderTypes: [shareholders_investors]}
  - {id: inquiries_feedback, label: 查詢及意見反饋, kind: participation_mechanism, allowedStakeholderTypes: [shareholders_investors]}
  - {id: thematic_exchange, label: 專題交流, kind: collaboration_activity, allowedStakeholderTypes: [shareholders_investors]}

  - {id: customer_visits, label: 客戶探訪, kind: communication_channel, allowedStakeholderTypes: [customers]}
  - {id: customer_service_channels, label: 客戶服務熱線及網上渠道, kind: communication_channel, allowedStakeholderTypes: [customers]}
  - {id: satisfaction_survey, label: 滿意度調查, kind: participation_mechanism, allowedStakeholderTypes: [customers, employees]}
  - {id: complaints_feedback, label: 投訴及意見反饋, kind: participation_mechanism, allowedStakeholderTypes: [customers, community_public]}
  - {id: technical_exchange_joint_solution, label: 技術交流及聯合方案, kind: collaboration_activity, allowedStakeholderTypes: [customers]}

