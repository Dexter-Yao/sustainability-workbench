    excerptFrom: 港交所·附錄C2·關鍵績效指標 B6.4
    standardDisclosureRequirementText: 應描述質量檢定過程及產品回收程序。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B6.4
