# ABOUTME(en): Appendix C2 disclosure requirements of「產品責任」(General Disclosure and KPIs), grouped by pillar,
# ABOUTME(en): for the coverage audit and for prompt assembly by key whitelist (injection is switch-gated, off by default) and for the coverage audit. Wording awaits check against the official Chinese text.
topicStandardDisclosureRequirementGroups:
- topicSectionKey: product_responsibility.gov
  pillar: governance
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: product_responsibility.gov.general_disclosure_policies
    standardDisclosureRequirementTitle: 產品責任政策
    excerptFrom: 港交所·附錄C2·一般披露 B6
    standardDisclosureRequirementText: 應披露有關所提供產品和服務的健康與安全、廣告、標籤及私隱事宜以及補救方法的政策。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 一般披露 B6
  - standardDisclosureRequirementKey: product_responsibility.gov.general_disclosure_compliance
    standardDisclosureRequirementTitle: 遵守產品責任相關法律及規例
    excerptFrom: 港交所·附錄C2·一般披露 B6
    standardDisclosureRequirementText: 應披露遵守對發行人有重大影響的產品責任相關法律及規例的資料。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 一般披露 B6
- topicSectionKey: product_responsibility.strategy
  pillar: strategy
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: product_responsibility.strategy.quality_direction
    standardDisclosureRequirementTitle: 產品質量及客戶服務方針
    excerptFrom: 港交所·附錄C2·一般披露 B6
    standardDisclosureRequirementText: 應說明公司在產品質量、廣告及標籤合規方面的方針及目標。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 一般披露 B6
