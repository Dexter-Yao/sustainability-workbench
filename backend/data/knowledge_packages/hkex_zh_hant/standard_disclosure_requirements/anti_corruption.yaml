    standardDisclosureRequirementTitle: 已審結的貪污訴訟案件數目及結果
    excerptFrom: 港交所·附錄C2·關鍵績效指標 B7.1
    standardDisclosureRequirementText: 應披露於匯報期內對發行人或其僱員提出並已審結的貪污訴訟案件的數目及訴訟結果。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B7.1
