    excerptFrom: 港交所·附錄C2·關鍵績效指標 B7.3
    standardDisclosureRequirementText: 應描述向董事及僱員提供的反貪污培訓。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B7.3
- topicSectionKey: anti_corruption.metrics
  pillar: metrics_targets
