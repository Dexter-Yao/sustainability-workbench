# ABOUTME(en): Appendix C2 disclosure requirements of「健康與安全」(General Disclosure and KPIs), grouped by pillar,
# ABOUTME(en): for the coverage audit and for prompt assembly by key whitelist (injection is switch-gated, off by default) and for the coverage audit. Wording awaits check against the official Chinese text.
topicStandardDisclosureRequirementGroups:
- topicSectionKey: health_and_safety.gov
  pillar: governance
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: health_and_safety.gov.general_disclosure_policies
    standardDisclosureRequirementTitle: 職業健康與安全政策
    excerptFrom: 港交所·附錄C2·一般披露 B2
    standardDisclosureRequirementText: 應披露有關提供安全工作環境及保障僱員避免職業性危害的政策。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 一般披露 B2
  - standardDisclosureRequirementKey: health_and_safety.gov.general_disclosure_compliance
    standardDisclosureRequirementTitle: 遵守職業安全及健康相關法律及規例
    excerptFrom: 港交所·附錄C2·一般披露 B2
    standardDisclosureRequirementText: 應披露遵守對發行人有重大影響的職業安全及健康相關法律及規例的資料。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 一般披露 B2
- topicSectionKey: health_and_safety.strategy
  pillar: strategy
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: health_and_safety.strategy.ohs_targets
    standardDisclosureRequirementTitle: 職業健康與安全目標
    excerptFrom: 港交所·附錄C2·一般披露 B2
    standardDisclosureRequirementText: 應說明公司在職業健康與安全方面的目標及推進方向。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 一般披露 B2
- topicSectionKey: health_and_safety.iro
  pillar: iro_management
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: health_and_safety.iro.ohs_measures
    standardDisclosureRequirementTitle: 職業健康與安全措施及其實施與監察
    excerptFrom: 港交所·附錄C2·關鍵績效指標 B2.3
    standardDisclosureRequirementText: 應描述所採納的職業健康與安全措施，以及相關執行及監察方法。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B2.3
- topicSectionKey: health_and_safety.metrics
  pillar: metrics_targets
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: health_and_safety.metrics.fatalities_data
    standardDisclosureRequirementTitle: 過去三年因工亡故的人數及比率
    excerptFrom: 港交所·附錄C2·關鍵績效指標 B2.1
    standardDisclosureRequirementText: 應披露過去三年（包括匯報年度）每年因工亡故的人數及比率。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B2.1
  - standardDisclosureRequirementKey: health_and_safety.metrics.lost_days_data
    standardDisclosureRequirementTitle: 因工傷損失工作日數
    excerptFrom: 港交所·附錄C2·關鍵績效指標 B2.2
    standardDisclosureRequirementText: 應披露因工傷損失的工作日數。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B2.2
