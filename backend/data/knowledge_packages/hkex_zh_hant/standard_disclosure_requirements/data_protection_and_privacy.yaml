  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: data_protection_and_privacy.metrics.data_breach_data
    standardDisclosureRequirementTitle: 個人資料外洩事故
    excerptFrom: 港交所·附錄C2·關鍵績效指標 B6.5
    standardDisclosureRequirementText: 如有已確認的個人資料外洩事故，應披露其數目及處理情況。
    disclosureRequirementObligationLevel: conditional
    sourceClauseReferenceLabels:
    - standard: HKEX
      clauseRef: 關鍵績效指標 B6.5
