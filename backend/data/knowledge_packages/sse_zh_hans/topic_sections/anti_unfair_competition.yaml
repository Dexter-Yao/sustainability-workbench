        guidance: 概括本内容单元的核心行动或结果，生成简洁、准确且不引入新事实的标题。
      appears_when:
        all:
        - path: intakeItems.anti_unfair_competition.q_litigation_reports
          op: eq
          value: 是
      blocks:
      - id: anti_unfair_competition.iro_litigation_penalties
        type: paragraph
        blockType: constrained
        source: ai
        styleRole: body
        generation:
          task:
            focus: "说明反不正当竞争相关诉讼、行政处罚和整改情况。"
          inputs:
            evidence:
              kind: explicit
              intakeItems:
              - anti_unfair_competition.q_litigation_reports
          targetChars:
          - 140
          - 300
          standardDisclosureRequirementKeys:
          - anti_unfair_competition.iro.litigation_penalties_conditional
    - key: anti_unfair_competition.iro.partner_fair_competition_terms
      title: 合作伙伴公平竞争约定
      headingLevel: 4
      blocks:
      - id: anti_unfair_competition.iro_partner_fair_competition_terms
        type: paragraph
        blockType: generative
        source: ai
        styleRole: body
        generation:
          task:
            focus: "基于用户上传的经销商或合作伙伴合同条款、公平竞争约定类资料，说明对合作伙伴的公平竞争要求与执行安排。"
          inputs:
            evidence:
              kind: material_gated
          targetChars:
          - 140
          - 300
          standardDisclosureRequirementKeys:
          - anti_unfair_competition.iro.partner_requirements_required
          simplifiedWritingGuidance:
            - "只作有据叙述：可独立核验的对象、名称、数值与日期须资料明确记载才可写，不得推断或补写。"
            - "资料记载的未按期、超期或不合规情形如实保留其性质表述，不淡化省略，也不添加资料未记载的保证性评价。"
            - "不展开贪污贿赂、廉洁培训或举报内容（归反商业贿赂与反贪污议题）。"
metricDisclosure:
