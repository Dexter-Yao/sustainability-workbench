  - key: anti_unfair_competition.iro
    title: 影响、风险与机遇管理
    pillar: iro_management
    headingLevel: 3
    children:
    - key: anti_unfair_competition.iro.fair_competition_controls
      title: 公平竞争与宣传合规
      headingLevel: 4
      titleGeneration:
        sourceBlockId: anti_unfair_competition.iro_fair_competition_controls
        guidance: 概括本内容单元的核心行动或结果，生成简洁、准确且不引入新事实的标题。
      blocks:
      - id: anti_unfair_competition.iro_fair_competition_controls
        type: paragraph
        blockType: generative
        source: ai
        styleRole: body
        generation:
          task:
            focus: "说明公平竞争、宣传合规和相关风险防范的管理实践。"
          inputs:
            evidence:
              kind: explicit
              intakeItems:
              - anti_unfair_competition.q_advertising_review_requirements
              - anti_unfair_competition.q_trade_secret_protection
          targetChars:
          - 200
          - 420
          standardDisclosureRequirementKeys:
          - anti_unfair_competition.iro.controls_required
          simplifiedWritingGuidance:
            - "聚焦用户已披露的宣传内容审核、对外经营公平竞争、商业秘密保护和合作伙伴相关要求，同一事实在本块内组织一次。"
            - "商业秘密保护只写用户已确认的安排；未提供具体措施时不坐实保密协议、分级管控或专项系统。"
    - key: anti_unfair_competition.iro.litigation_penalties
      title: 诉讼与处罚
      headingLevel: 4
      titleGeneration:
