# ABOUTME: 风险管理议题章节骨架，H2 标题以附录索引表“对应的本报告章节”为准。
# ABOUTME: 本文件按参考模板拆分治理架构、制度遵循、战略、风险管理流程和指标目标，指标由定量目录风险管理五项承载。
section:
