        - key: risk_type
          header: 风险与机遇类型
          cellType: text
          required: true
          genHint: 结合主营业务与所属行业，给出简短的反腐败风险类型名称；不写成已发生事件。
        - key: risk_name
          header: 风险与机遇名称
          cellType: text
          required: true
          genHint: 给出简短风险名称，优先使用法规合规、人员廉洁意识或第三方合作等方向；不写成已发生事件。
        - key: risk_content
          header: 潜在影响
          cellType: ai_text
          required: true
          genHint: 结合主营业务与所属行业，说明该风险的来源与潜在影响；使用方向性、框架性口径，不写成已发生事实、具体客户事件、审计发现、举报或处罚。
        - key: financial_impact
          header: 财务影响
          cellType: multi_select
          options:
          - 合规成本增加
          - 营业收入下降
          - 罚款或赔偿支出
          - 合同损失
        - key: time_horizon
          header: 影响的时间范围
          cellType: multi_select
          options:
          - 短期
          - 中期
          - 长期
        - key: response_measures
          header: 应对措施
          cellType: ai_text
          required: true
          genHint: 使用2-3个短句，围绕廉洁要求、合规宣贯、关键岗位约束、供应商沟通或风险提示等基础方向；不编造审计项目、举报渠道、正式闭环、协议签署比例或供应商数量。
