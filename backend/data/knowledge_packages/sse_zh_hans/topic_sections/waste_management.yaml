# ABOUTME: 废弃物管理议题章节骨架，H2 标题以附录索引表“对应的本报告章节”为准。
# ABOUTME: 本文件承载废弃物管理的段落级生成块；指标块按声明读取ESG 定量数据表的受控投影。
section:
  key: waste_management
  title: 废弃物管理
  headingLevel: 2
  reportSectionId: waste_management
  conciseDisclosure:
    id: waste_management.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: "根据本议题当前可见证据形成一段连贯摘要，覆盖相关管理关注、方向与实践，不使用四要素小标题。"
      inputs: {evidence: {kind: report_section}}
      targetChars: [300, 600]
  children:
  - key: waste_management.gov
    title: 治理
    pillar: governance
    headingLevel: 3
    blocks:
    - id: waste_management.gov_management_system
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: "说明废弃物管理的责任安排、制度机制和协调方式。"
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - waste_management.q_governance_roles
            - waste_management.q_governance_policies
            - waste_management.q_governance_certifications
        targetChars:
        - 180
        - 360
        standardDisclosureRequirementKeys:
        - waste_management.gov.responsibility_structure_required
        - waste_management.gov.responsibility_structure_encouraged
        - waste_management.gov.waste_management_required
        - waste_management.gov.waste_management_encouraged
        - waste_management.gov.policy_documents_required
        - waste_management.gov.policy_documents_encouraged
  - key: waste_management.strategy
    title: 战略
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: waste_management.strategy_control_framework
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: "说明废弃物减量、规范处置和资源化利用的长期方向与推进原则。"
        inputs:
          evidence:
            kind: explicit
            intakeItems:
            - waste_management.q_strategy_content
        targetChars:
        - 220
        - 460
        standardDisclosureRequirementKeys:
        - waste_management.strategy.control_framework_required
        - waste_management.strategy.control_framework_encouraged
        - waste_management.strategy.waste_reduction_required
        - waste_management.strategy.waste_reduction_encouraged
