    clauseOriginalText: 披露主体报告期末应付账款（含应付票据）余额占总资产的比重超过50%的，应当披露报告期末逾期未支付款项的金额，以及拟采取的解决方案。披露主体或者其控股子公司通过国家企业信用信息公示系统向社会公示逾期尚未支付中小企业款项信息的，应当披露逾期未支付中小企业款项的金额、对中小企业供应商的账期设置、逾期账款的形成原因、是否涉及诉讼仲裁等情况，并披露解决方案。本所鼓励其他披露主体参照前两款规定进行披露。
- reportContentTopicName: 产品质量与安全
  reportSectionKey: product_quality_safety
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十四条
  - 第四十七条
  clauseOriginalTexts:
  - clauseReference: 第四十四条
    clauseOriginalText: 披露主体应当在追求经济效益、保护股东利益的同时，保护债权人利益，诚信对待供应商、客户和消费者。
  - clauseReference: 第四十七条
    clauseOriginalText: 披露主体应当披露报告期内产品和服务的安全与质量管理的基本情况，包括但不限于下列内容：（一）产品和服务质量管理体系、制度的建设、执行情况以及具体措施；（二）公司获得的质量管理相关的认证、主要产品和服务质量管理体系认证情况；（三）报告期内发生的产品和服务相关的安全与质量重大责任事故，包括事件性质（如行政处罚等）、造成的影响及损害涉及的金额、采取的应对措施及进展（如有）；（四）售后服务、产品召回制度的建立与执行情况，针对客户投诉的受理途径、处理流程及处理情况。本所鼓励金融、医疗、电力、通讯、公用事业等行业的披露主体披露报告期内产品和服务的可获得性（如普惠金融、普惠医疗等）相关信息。
