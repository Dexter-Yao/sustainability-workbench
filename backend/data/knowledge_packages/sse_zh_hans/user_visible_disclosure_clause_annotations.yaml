- reportContentTopicName: 人力资本发展
  reportSectionKey: human_capital_development
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十九条
  - 第五十条
  clauseOriginalTexts:
  - clauseReference: 第四十九条
    clauseOriginalText: 披露主体应当依法保护员工合法权益，为员工提供健康与安全的工作条件，及时支付员工薪酬、缴纳员工社保，加强员工培训，建立合理有效的员工申诉制度。
  - clauseReference: 第五十条
    clauseOriginalText: 披露主体应当披露报告期内员工的总体情况，包括但不限于下列内容：（一）员工的聘用与待遇等方面的政策及执行情况，包括但不限于报告期内吸纳就业、创造灵活就业岗位的情况，期末在职员工的性别、年龄等构成情况，报告期内支付员工工资和缴纳员工社保、公司劳工纠纷、员工变动、对灵活就业人员的权益保障、招聘录用程序合规与公平透明情况等；（二）职业健康与安全的基本情况，包括但不限于针对公司职业安全风险及来源的识别与评估情况，职业健康安全管理体系的建立及实施情况、相应资质认证获得情况、相关培训情况，工伤保险、安全生产责任险的投入金额及人员覆盖率，报告期内安全事故的具体情况（如有）等；（三）员工职业发展与培训的基本情况，包括但不限于公司职位体系设置情况，员工晋升、选拔与职业发展机制，员工培训类型、次数、开展情况，以及年度培训支出金额、员工培训覆盖率等。
