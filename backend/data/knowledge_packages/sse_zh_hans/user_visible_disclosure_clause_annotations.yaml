- reportContentTopicName: 污染物排放管理
  reportSectionKey: pollutant_emissions_management
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第二十九条
  - 第三十条
  - 第三十三条
  clauseOriginalTexts:
  - clauseReference: 第二十九条
    clauseOriginalText: 披露主体应当将支持美丽中国建设、生态环境保护融入公司发展战略和公司治理过程，并根据自身生产经营特点、生态环境管理要求、对环境的影响、受影响公众的一致诉求等实际情况，落实相关环境管理制度，采取有效措施履行生态环境保护责任，防治环境污染，保护生物多样性。
  - clauseReference: 第三十条
    clauseOriginalText: 披露主体或者其重要控股子公司被列入环境信息依法披露企业名单的，应当披露下列信息：（一）排污信息，包括但不限于主要污染物、特征污染物以及国际环境公约规定的受控物质的种类、名称、排放总量、核定的排放总量、超标排放情况、环保绩效等级情况（如有）等，鼓励披露主体按照业务单位或设施、来源类型、活动类型等分类披露污染物排放的具体情况；（二）对污染物的处理技术和处理方式，污染防治设施的建设、运行情况和实施成果（例如排放浓度、强度或排放总量的降幅）；（三）主要污染物减排目标及为达到相关目标所采取的具体措施；（四）污染物排放对员工、当地社区居民等群体的影响；（五）报告期内因污染物排放受到重大行政处罚或被追究刑事责任的情况，以及公司环境监测方案和风险管理措施是否存在重大缺陷。本所鼓励其他披露主体参照前款规定进行披露。
  - clauseReference: 第三十三条
    clauseOriginalText: 披露主体应当结合报告期内的实际情况，披露下列环境信息：（一）针对环境事件的风险评估、预防相关风险的管理措施和针对突发环境事件的应急预案总体情况；（二）报告期内突发重大环境事件的发生日期、地点和持续时间，事件等级、事件处理方式和处理结果，对公司、社会公众的影响以及整改措施；（三）报告期内因环境事件受到生态环境等有关部门重大行政处罚或被追究刑事责任的情况，包括但不限于违规情形、处罚原因、处罚金额、对披露主体生产经营的影响以及公司的整改措施等。
