- reportContentTopicName: 反不正当竞争
  reportSectionKey: anti_unfair_competition
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第五十四条
  - 第五十六条
  clauseOriginalTexts:
  - clauseReference: 第五十四条
    clauseOriginalText: 披露主体在经营活动中，应当遵循自愿、公平、等价有偿、诚实信用的原则，遵守社会公德、商业道德，不得通过贿赂等非法活动谋取不正当利益，不得侵犯他人的商标权、专利权和著作权等知识产权，不得从事不正当竞争行为。
  - clauseReference: 第五十六条
    clauseOriginalText: 披露主体应当披露报告期内反不正当竞争工作的具体情况，包括但不限于下列内容：（一）防范不正当竞争行为（如虚假宣传、实施垄断行为、侵犯商业秘密等）管理制度体系建立与运作情况及具体措施；（二）报告期内因公司不正当竞争行为导致诉讼或重大行政处罚的，应当披露具体诉讼情况、涉案金额、受到的行政处罚相关情况以及整改措施。
