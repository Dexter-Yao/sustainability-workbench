- reportContentTopicName: 可持续供应链管理
  reportSectionKey: sustainable_supply_chain_management
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十四条
  - 第四十五条
  clauseOriginalTexts:
  - clauseReference: 第四十四条
    clauseOriginalText: 披露主体应当在追求经济效益、保护股东利益的同时，保护债权人利益，诚信对待供应商、客户和消费者。
  - clauseReference: 第四十五条
    clauseOriginalText: 披露主体应当披露报告期内加强供应链风险管理、保障供应链安全稳定的情况，包括但不限于下列内容：（一）供应链风险管理的基本情况，包括但不限于公司制定的供应链风险管理目标及具体计划、供应链风险应对机制、措施及实施效果；（二）通过并购重组、科技创新等保障自身供应链安全、强化供应链优势等方面的举措和积极效果。本所鼓励披露主体披露加强供应链管理、促进供应链可持续发展的行动和举措。
