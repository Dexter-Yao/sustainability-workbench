- reportContentTopicName: 可持续发展管理
  reportSectionKey: sustainability_mgmt
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第五十一条
  clauseOriginalTexts:
  - clauseReference: 第五十一条
    clauseOriginalText: 披露主体应当结合公司实际情况以及本指引的要求，积极将可持续发展理念融入公司治理的各项制度和流程，进一步健全和完善公司治理机制，推动公司可持续发展。
