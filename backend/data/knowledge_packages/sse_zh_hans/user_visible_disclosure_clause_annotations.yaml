# ABOUTME: 用户可见准则批注的大陆交易所条款原文事实源，来源为附录索引表与三所原始准则文件。
# ABOUTME: 本文件只服务前端批注与诊断，不进入 Prompt；准则披露要求映射由 standard_disclosure_requirements 独立承担。

entries:
- reportContentTopicName: 应对气候变化
  reportSectionKey: climate_change
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第二十条
  - 第二十一条
  - 第二十二条
  - 第二十三条
  - 第二十四条
  - 第二十五条
  - 第二十六条
  - 第二十七条
  - 第二十八条
  - 第三十四条
  - 第三十五条
  clauseOriginalTexts:
  - clauseReference: 第二十条
    clauseOriginalText: 披露主体应当积极通过改进工艺、升级生产设备、优化能源结构、提高生产能效、研发和提供绿色产品与服务、改进和强化管理等措施，实现绿色低碳发展，支持美丽中国建设。
  - clauseReference: 第二十一条
    clauseOriginalText: 披露主体除按照本指引第二章的规定披露应对气候变化相关治理，战略，影响、风险和机遇管理，指标与目标等内容外，还应当按照本节规定披露应对气候变化的相关信息。
  - clauseReference: 第二十二条
    clauseOriginalText: 披露主体应当结合所识别的气候相关风险和机遇，评估公司的战略、商业模式等对气候变化的适应性，并披露下列事项：（一）公司关于气候变化对其战略和商业模式影响的评估情况，以及应对相关影响的方法；（二）公司在评估其气候适应性时考虑的重大不确定性因素；（三）公司在短期、中期和长期内为适应气候变化调整其战略和商业模式的能力。本所鼓励有条件的披露主体采用情景分析等方式进行气候适应性评估，并披露情景分析关键假设、分析过程等。
  - clauseReference: 第二十三条
    clauseOriginalText: 披露主体应当披露为应对气候相关风险和机遇的转型计划、措施及其进展，包括但不限于下列内容：（一）公司为应对气候相关风险和机遇而对当前和未来战略、商业模式和资源分配进行调整的情况；（二）公司已经或者计划为直接或间接应对气候相关风险和机遇所采取的改进生产工艺、更新设备等措施；（三）公司为应对气候相关风险和机遇所制定的转型计划，及制定该计划所依赖的基本假设；（四）公司为实施转型计划提供的资源；（五）公司实施转型计划的进展情况。
  - clauseReference: 第二十四条
    clauseOriginalText: 披露主体应当核算并披露报告期内的温室气体排放总量，并将不同温室气体排放量换算成二氧化碳当量公吨数。披露主体应当披露温室气体范围1排放量、范围2排放量，鼓励有条件的披露主体披露温室气体范围3排放量。披露主体涉及使用碳信用额度的，应当披露所使用的碳信用额度的来源与数量。披露主体参与碳排放权交易的，应当披露报告期内是否完成清缴以及是否存在被有关部门要求整改或立案调查的情形。本所鼓励有条件的披露主体聘请第三方机构对公司温室气体排放等数据进行核查或鉴证。
  - clauseReference: 第二十五条
    clauseOriginalText: 为提高温室气体排放透明度和可比性，本所鼓励披露主体按照下列分类提供不同范围温室气体排放情况：（一）业务单位或设施；（二）国家或地区；（三）来源类型（燃烧、加工、电力、供暖、制冷和蒸汽等）。
  - clauseReference: 第二十六条
    clauseOriginalText: 披露主体应当披露核算温室气体排放量所依据的标准、方法、假设或计算工具，并说明排放量的合并方法（如股权比例、财务控制、运营控制等）。报告期内核算标准、方法、假设等发生变化的，应当说明原因并披露具体影响。
  - clauseReference: 第二十七条
    clauseOriginalText: 披露主体应当披露温室气体减排实践的相关信息，包括参与各项减排机制的情况、减排目标、减排措施（如管理措施、资金投入、技术开发等）及其成效等。披露主体应当按照不同温室气体排放范围分类披露因重新设计生产流程、改造设备、改进工艺、更换燃料等减排措施直接减少的温室气体排放量，并换算成二氧化碳当量公吨数，披露主体可以按照不同减排措施分别披露减排情况。披露主体应当披露其在全国温室气体自愿减排项目和核证自愿减排量（CCER）的登记与交易情况、参与其他减排机制的项目和减排量登记与交易情况等内容（如有）。
  - clauseReference: 第二十八条
    clauseOriginalText: 披露主体披露有利于减少碳排放、实现碳中和的新技术、新产品、新服务以及相关研发进展的，应当客观、审慎地披露相关工艺技术形成的产品或服务的具体情况、相关业务的研发投入及进度、已取得的审批或认证、已具备的规模化生产能力、已取得的订单情况等，鼓励说明对披露主体当期及未来财务状况和经营成果的影响，以及可能存在的不确定性和风险等。
  - clauseReference: 第三十四条
    clauseOriginalText: 披露主体应当集约、高效利用能源、水、原材料等资源，加强资源使用过程节约管理，推动生产、流通过程的减量化、再利用、再循环。
  - clauseReference: 第三十五条
    clauseOriginalText: 披露主体应当披露报告期内使用能源的具体情况，包括但不限于下列内容：（一）能源使用的基本情况，包括但不限于按类型划分的直接及间接能源（如煤、电、气或油）总能耗量（以吨标准煤计算）、结构及总能耗强度（如以每产量单位计算）等；（二）清洁能源使用情况，包括但不限于风能、太阳能、水能、地热能、生物质资源、海洋能、天然气等清洁能源的种类、总量、比例等；（三）能源节约目标以及具体措施，包括但不限于采购节能生产设备、节能照明设备、节能温控设备，采用余热余压利用、能源梯级利用等措施，能源使用存在的具体困难（如有）。
