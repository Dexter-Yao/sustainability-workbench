- reportContentTopicName: 废弃物管理
  reportSectionKey: waste_management
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第二十九条
  - 第三十一条
  - 第三十三条
  clauseOriginalTexts:
  - clauseReference: 第二十九条
    clauseOriginalText: 披露主体应当将支持美丽中国建设、生态环境保护融入公司发展战略和公司治理过程，并根据自身生产经营特点、生态环境管理要求、对环境的影响、受影响公众的一致诉求等实际情况，落实相关环境管理制度，采取有效措施履行生态环境保护责任，防治环境污染，保护生物多样性。
  - clauseReference: 第三十一条
    clauseOriginalText: 披露主体生产经营活动产生的废弃物对环境产生重大影响的，应当披露报告期内产生的废弃物的基本情况：（一）产生的有害废弃物、无害废弃物的总量（以吨计算）及密度（如以单位营收、单位产量、每项设施计算）；（二）有害废弃物、无害废弃物的处理方法、处置情况；（三）废弃物减排目标及为达到目标所采取的具体措施。
