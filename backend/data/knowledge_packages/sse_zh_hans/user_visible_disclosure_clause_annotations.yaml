- reportContentTopicName: 尽职调查
  reportSectionKey: due_diligence
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第五十二条
  clauseOriginalTexts:
  - clauseReference: 第五十二条
    clauseOriginalText: 本所鼓励披露主体结合实际情况披露报告期内识别和应对可持续发展相关负面影响或风险的尽职调查情况，包括但不限于负责尽职调查的机构或人员、尽职调查的范围、识别可持续发展相关负面影响或风险的程序及应对相关负面影响和风险的具体情况。
