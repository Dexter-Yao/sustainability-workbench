    clauseOriginalText: 披露主体应当披露报告期内使用能源的具体情况，包括但不限于下列内容：（一）能源使用的基本情况，包括但不限于按类型划分的直接及间接能源（如煤、电、气或油）总能耗量（以吨标准煤计算）、结构及总能耗强度（如以每产量单位计算）等；（二）清洁能源使用情况，包括但不限于风能、太阳能、水能、地热能、生物质资源、海洋能、天然气等清洁能源的种类、总量、比例等；（三）能源节约目标以及具体措施，包括但不限于采购节能生产设备、节能照明设备、节能温控设备，采用余热余压利用、能源梯级利用等措施，能源使用存在的具体困难（如有）。
- reportContentTopicName: 环境合规管理
  reportSectionKey: environmental_compliance_management
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第二十九条
  - 第三十三条
  clauseOriginalTexts:
  - clauseReference: 第二十九条
    clauseOriginalText: 披露主体应当将支持美丽中国建设、生态环境保护融入公司发展战略和公司治理过程，并根据自身生产经营特点、生态环境管理要求、对环境的影响、受影响公众的一致诉求等实际情况，落实相关环境管理制度，采取有效措施履行生态环境保护责任，防治环境污染，保护生物多样性。
  - clauseReference: 第三十三条
    clauseOriginalText: 披露主体应当结合报告期内的实际情况，披露下列环境信息：（一）针对环境事件的风险评估、预防相关风险的管理措施和针对突发环境事件的应急预案总体情况；（二）报告期内突发重大环境事件的发生日期、地点和持续时间，事件等级、事件处理方式和处理结果，对公司、社会公众的影响以及整改措施；（三）报告期内因环境事件受到生态环境等有关部门重大行政处罚或被追究刑事责任的情况，包括但不限于违规情形、处罚原因、处罚金额、对披露主体生产经营的影响以及公司的整改措施等。
