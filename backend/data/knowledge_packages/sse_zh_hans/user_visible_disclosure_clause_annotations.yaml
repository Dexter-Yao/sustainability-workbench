- reportContentTopicName: 创新驱动
  reportSectionKey: innovation_driven
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十一条
  - 第四十二条
  clauseOriginalTexts:
  - clauseReference: 第四十一条
    clauseOriginalText: 本所鼓励披露主体积极践行创新驱动发展战略，持续提升创新能力和竞争力，在创新决策和实践中遵守科学伦理规范，尊重科学精神，发挥科学技术的正面效应。
  - clauseReference: 第四十二条
    clauseOriginalText: 在不涉及国家安全、国家秘密，兼顾保护商业秘密的前提下，本所鼓励披露主体自愿披露报告期内推动科技创新、加强科技成果转化应用、提高科技竞争力的具体情况，包括但不限于下列内容：（一）科技创新的战略和目标，涉及投入金额的，应当同时披露相关资金的筹措安排及保障措施；（二）开展科技创新的具体情况，包括研发创新管理制度体系建设，参与研发创新、科技合作项目的情况，研发投入金额及占主营业务收入比例、研发人员数量及占比、应用于主营业务的发明专利数量等；（三）取得的研发进展及成果、获得的专业资质和重要奖项等，包括报告期内发明专利的申请数和授权数、有效专利数，高新技术企业认定情况、国家科学技术奖项获奖情况等；（四）科技创新成果及其应用对推动发展新质生产力的作用，以及对经济、社会、环境和利益相关方的影响等。
