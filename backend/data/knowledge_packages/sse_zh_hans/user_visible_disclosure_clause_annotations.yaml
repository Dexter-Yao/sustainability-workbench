- reportContentTopicName: 平等对待中小企业
  reportSectionKey: sme_fair_treatment
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十四条
  - 第四十六条
  clauseOriginalTexts:
  - clauseReference: 第四十四条
    clauseOriginalText: 披露主体应当在追求经济效益、保护股东利益的同时，保护债权人利益，诚信对待供应商、客户和消费者。
  - clauseReference: 第四十六条
    clauseOriginalText: 披露主体报告期末应付账款（含应付票据）余额超过300亿元或占总资产的比重超过50%的，应当披露报告期末逾期未支付款项的金额，以及拟采取的解决方案。披露主体或者其控股子公司通过国家企业信用信息公示系统向社会公示逾期尚未支付中小企业款项信息的，应当披露逾期未支付中小企业款项的金额、对中小企业供应商的账期设置、逾期账款的形成原因、是否涉及诉讼仲裁等情况，并披露解决方案。本所鼓励其他披露主体参照前两款规定进行披露。
