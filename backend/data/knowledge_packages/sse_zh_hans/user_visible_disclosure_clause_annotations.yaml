- reportContentTopicName: 利益相关方沟通
  reportSectionKey: sm.stakeholder
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第五十三条
  clauseOriginalTexts:
  - clauseReference: 第五十三条
    clauseOriginalText: 披露主体应当披露报告期内与包括投资者在内的利益相关方沟通的具体情况，包括但不限于下列内容：（一）利益相关方沟通制度的建设、执行情况；（二）听取、反馈利益相关方意见建议的渠道及执行情况，如沟通方式、沟通频率、沟通内容等。
- reportContentTopicName: 利益相关方沟通
  reportSectionKey: sm.stakeholder
