- reportContentTopicName: 科技伦理
  reportSectionKey: technology_ethics
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十三条
  clauseOriginalTexts:
  - clauseReference: 第四十三条
    clauseOriginalText: 披露主体从事生命科学、人工智能等科技伦理敏感领域的科学研究、技术开发等活动的，应当披露报告期内遵守科技伦理的基本情况，包括但不限于下列内容：（一）从事科技研究、技术开发等科技活动的领域及遵守的科技伦理规范；（二）内部管理制度中关于科技伦理的规定及其落实情况，科技伦理（审查）委员会的设置及其运作情况（如有）；（三）违反科技伦理的行为，包括相关行为的基本情况、被有权机关处罚的情况，内部调查处理与责任追究情况，以及采取的整改措施（如有）；（四）开展科技伦理内外部培训及科普宣传等情况。
