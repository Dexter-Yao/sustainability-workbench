- reportContentTopicName: 数据安全与客户隐私保护
  reportSectionKey: data_security_customer_privacy_protection
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第四十八条
  clauseOriginalTexts:
  - clauseReference: 第四十八条
    clauseOriginalText: 披露主体应当披露报告期内数据安全与客户隐私保护的基本情况，包括但不限于下列内容：（一）数据安全管理制度体系建立与运行情况及具体措施，获得的认证情况（如有）；（二）报告期内发生的数据安全事件的具体情况，包括造成的影响、涉及的金额、采取的应对措施及进展（如有）；（三）客户隐私保护制度体系建设与运行情况；（四）报告期内发生的泄露客户隐私事件的具体情况，包括造成的影响、涉及的金额、采取的应对措施及进展（如有）。
