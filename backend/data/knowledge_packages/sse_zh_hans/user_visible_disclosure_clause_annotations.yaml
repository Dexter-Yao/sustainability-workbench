- reportContentTopicName: 促进循环经济
  reportSectionKey: circular_economy_promotion
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第三十四条
  - 第三十七条
  clauseOriginalTexts:
  - clauseReference: 第三十四条
    clauseOriginalText: 披露主体应当集约、高效利用能源、水、原材料等资源，加强资源使用过程节约管理，推动生产、流通过程的减量化、再利用、再循环。
  - clauseReference: 第三十七条
    clauseOriginalText: 披露主体应当披露报告期内循环经济的具体情况，包括但不限于下列内容：（一）为实现循环经济而制定的具体目标和计划；（二）报告期内为实现循环经济而采取的具体措施，包括节省资源、提高资源利用率、使用可再生资源、预防和减少废弃物的产生以及回收利用废弃物等；（三）报告期内公司在实现循环经济目标方面取得的具体进展及成效，包括废弃物的回收及综合利用情况（含废弃物循环利用量）、可再生资源消耗量及占相应资源总消耗量的比例等。
