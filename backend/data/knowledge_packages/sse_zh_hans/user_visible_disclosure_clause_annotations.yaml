- reportContentTopicName: 反商业贿赂与反贪污
  reportSectionKey: anti_bribery_anti_corruption
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第五十四条
  - 第五十五条
  clauseOriginalTexts:
  - clauseReference: 第五十四条
    clauseOriginalText: 披露主体在经营活动中，应当遵循自愿、公平、等价有偿、诚实信用的原则，遵守社会公德、商业道德，不得通过贿赂等非法活动谋取不正当利益，不得侵犯他人的商标权、专利权和著作权等知识产权，不得从事不正当竞争行为。
  - clauseReference: 第五十五条
    clauseOriginalText: 披露主体应当披露报告期内反商业贿赂及反贪污工作的具体情况，包括但不限于下列内容：（一）反商业贿赂及反贪污风险管理制度体系建立与运行情况、是否建立举报者保护政策；（二）对商业贿赂及贪污风险进行评估的情况；（三）接受反商业贿赂及反贪污培训的董事、管理层人员、员工总数和百分比；（四）报告期内发生的商业贿赂及贪污事件的具体情况，包括董事、管理层人员、员工由于商业贿赂或贪污行为而被解雇或受到处分、被有权部门调查、与业务合作伙伴的合同被终止或未续约以及针对公司或其董事、管理层人员、员工商业贿赂或贪污行为的诉讼案件具体情况（如有）。
