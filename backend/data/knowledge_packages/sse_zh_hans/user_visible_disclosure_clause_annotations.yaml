- reportContentTopicName: 乡村振兴与社会贡献
  reportSectionKey: rural_revitalization_social_contribution
  mainlandStandard: sse
  appendixIndexClauseReferences:
  - 第三十八条
  - 第三十九条
  - 第四十条
  clauseOriginalTexts:
  - clauseReference: 第三十八条
    clauseOriginalText: 本所鼓励披露主体结合自身主营业务开展情况支持乡村振兴、社会公益事业，在保障公司健康发展、持续回报投资者的同时促进经济社会可持续发展。
  - clauseReference: 第三十九条
    clauseOriginalText: 披露主体应当披露报告期内支持乡村振兴的具体情况，包括但不限于下列内容：（一）披露主体在乡村和脱贫地区业务占比较高的，应当结合业务开展情况披露公司将支持乡村振兴、巩固拓展脱贫攻坚成果融入公司战略的具体情况；（二）结合在乡村和脱贫地区业务开展情况，披露支持乡村特色产业发展、支持当地就业等方面采取的具体措施，以及其他支持乡村振兴工作的具体措施；（三）具体工作成果，包括报告期内总投入金额、惠及群体范围及数量，对公司品牌和业务开展的影响等。
  - clauseReference: 第四十条
    clauseOriginalText: 披露主体应当披露报告期内对公众及社会作出贡献的基本情况，包括但不限于开展公益慈善、志愿活动等方面的具体情况，以及投入资金金额、人员、时间、取得的效果、对公司品牌和业务开展的影响等。
