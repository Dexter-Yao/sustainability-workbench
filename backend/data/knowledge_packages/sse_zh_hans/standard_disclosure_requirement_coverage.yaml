# ABOUTME: 准则披露要求覆盖审定表——每条 required 要求在轻量版 schema 中的承载处置，是人工审定的权威事实。
# ABOUTME: 运行期由披露覆盖判定读取；coverageStatus 表达设计期处置，不表达某次报告的运行期结果。
#
# coverageStatus 取值：
#   bound_to_block           由议题章节的生成块承载（块实际是否产出由运行期证据门控决定）
#   metric_disclosure_catalog 由定量指标目录与附录 ESG 关键绩效表承载，不设独立生成块
#   integrated_report_level   按准则允许的整合披露，由报告级章节或相邻议题承载
#   excluded_for_simplified   轻量版有意不承载（须给 exclusionRationaleCode，构成对用户的产品承诺）
#   conditional_applicability 准则为鼓励或「如涉及」，按适用性触发，不构成缺口
#
# exclusionRationaleCode 供审阅稿「准则对照说明」页确定性投影中文措辞，不得直接展示本文件的 key。
# topicStatus 为 requirements_pending 的议题尚未建立要求库，审阅稿以汇总句说明，不冒充已审定。
