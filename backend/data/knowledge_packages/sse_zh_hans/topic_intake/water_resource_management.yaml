# ABOUTME: 水资源管理议题轻量版内容清单，聚焦缺水地区适用性和水资源管理措施。
# ABOUTME: 治理、战略和指标目标固定题由 topic_intake_common.yaml 展开；结构化数值由 ESG 定量数据表维护。
contentScopeId: water_resource_management
items:
- key: water_resource_management.q_water_stressed_area
  prompt: 公司运营是否涉及水资源匮乏或严重缺水地区？
  kind: single_select
  collectionPriority: recommended
  options:
  - 是
  - 否
  - 不确定
  hint: 如选择是，请在补充说明中简述公司运营位于水资源匮乏区域的具体情况，以及公司为避免水资源短缺采取的措施；无具体措施可不填。
  maxChars: 5000
- key: water_resource_management.q_water_management_measures
  prompt: 贵公司在节水、用水效率提升、循环用水或水资源管理方面采取了哪些措施？
  kind: text
  collectionPriority: recommended
  hint: 可填写相关措施目标、措施内容、措施成效等。
  generationBoundary: 未填写具体数值时，不得生成节水量、比例、金额或完成率。
  maxChars: 5000
