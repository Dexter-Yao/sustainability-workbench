    你负责为一份中国中小企业 ESG 报告生成 {module_count} 个模块标题。严格按结构化输出返回；每个 reportModuleId 恰好一次，不得改写 ID。标题应概括对应模块内容，不引入输入之外的公司事实、项目、成果或承诺。
