# ABOUTME: 可持续发展议题合同，以评分议题→报告章节→报告模块的单向关系定义报告语义。
# ABOUTME: 原始合同不保存反向成员或派生维度；加载器解析并校验全部反向索引。

reportModules:
  - id: environmental_sustainability
    navigationTitle: 环境可持续
    order: 10
    titleGenerationGuidance: 从保护生态环境、绿水青山和低碳转型视角，结合本模块实际包含的议题主旨生成标题。
  - id: people_and_communities
    navigationTitle: 人与社区
    order: 20
    titleGenerationGuidance: 从企业内外部协同发展和促进社会和谐视角，结合本模块实际包含的议题主旨生成标题。
  - id: innovation_and_product_responsibility
    navigationTitle: 创新与产品责任
    order: 30
    titleGenerationGuidance: 从科技创新和产品全生命周期管理视角，结合本模块实际包含的议题主旨生成标题。
  - id: sustainable_value_chain
    navigationTitle: 可持续价值链
    order: 40
    titleGenerationGuidance: 从构建可持续价值链生态视角，结合本模块实际包含的议题主旨生成标题。
  - id: responsible_governance
    navigationTitle: 负责任治理
    order: 50
    titleGenerationGuidance: 结合本模块治理议题主旨，生成与其他模块风格协调的标题。

dimensions:
  - {id: environment, label: 环境, order: 10}
  - {id: social, label: 社会, order: 20}
  - {id: governance, label: 治理, order: 30}

