# ABOUTME: 能源管理议题准则披露要求库，条目按上交所《指南第四号 能源利用》披露要点与《指引第14号》条款建模。
# ABOUTME: 本文件不作为用户可见准则批注来源；用户可见条款原文来自 user_visible_disclosure_clause_annotations。
topicStandardDisclosureRequirementGroups:
- topicSectionKey: energy_management.gov
  pillar: governance
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: energy_management.gov.responsibility_structure
    standardDisclosureRequirementTitle: 能源管理组织架构与职责分工
    excerptFrom: 上交所·指南第四号·第三章（治理要素参照指南第一号披露）
    standardDisclosureRequirementText: 应说明公司能源管理或节能降耗管理的组织架构、主管部门、职责分工、主要用能环节责任主体、管理者代表、跨部门协同或数据归集职责。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第三章（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
    note: 指南第四号第三章明确：已建立整体性治理结构和内部制度的，可对治理要素整合披露，无需单独披露能源利用相关治理信息。
  - standardDisclosureRequirementKey: energy_management.gov.energy_management_system
    standardDisclosureRequirementTitle: 能源管理体系与制度文件
    excerptFrom: 上交所·指南第四号·第三章；披露要点3（管理措施“建设能源管理系统”）
    standardDisclosureRequirementText: 应说明公司围绕能源使用、节能降耗和能源效率管理建立的制度、职责、资源承诺、管理者代表或体系运行安排。如涉及能源管理制度或关键流程，应说明制度名称、制度目标、适用范围、关键流程以及制度对提高能源利用效率、节能降耗或用能风险管控的保障作用。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第三章（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
  - standardDisclosureRequirementKey: energy_management.gov.certifications
    standardDisclosureRequirementTitle: 能源管理体系认证情况
    excerptFrom: 上交所·指南第四号·第三章（体系化能源管理框架）
    standardDisclosureRequirementText: 如涉及能源管理体系认证或其他能源管理相关认证信息，应说明认证名称、适用标准（如 ISO 50001、GB/T 23331-2020）、覆盖范围、有效期或报告期内复审情况。
    disclosureRequirementObligationLevel: conditional
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第三章（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
  - standardDisclosureRequirementKey: energy_management.gov.energy_review
    standardDisclosureRequirementTitle: 能源评审、目标与数据收集计划
    excerptFrom: 上交所·指南第四号·第二章 综合能耗核算方法；披露要点3（指标选取）
    standardDisclosureRequirementText: 应说明公司是否开展能源评审，识别主要能源使用环节，设置能源绩效参数、能源基准、目标指标、措施计划、责任资源时间表和能源数据收集计划。指南第四号第二章明确综合能耗计算可采用的原始数据包括能源计量器具读数记录、能耗在线监测系统数据记录、能源统计报表、发货单、能源费用账单等。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第二章（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
- topicSectionKey: energy_management.strategy
  pillar: strategy
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: energy_management.strategy.risk_opportunity
    standardDisclosureRequirementTitle: 能源利用相关风险和机遇评估
    excerptFrom: 上交所·指南第四号·第一章 能源利用相关风险和机遇评估
    standardDisclosureRequirementText: 应围绕能源相关风险与机遇，说明具体内容、财务影响、影响时间范围和应对措施。指南第四号第一章分类：能源利用相关物理风险（极端天气或地质灾害导致能源设施损坏、供应中断；可再生能源技术对特定资源的依赖；特定地域自然条件变化）；能源利用相关转型风险（环境保护与公共政策收紧、客户偏好转变、能源替代或新型低碳能源研发投入增加）；能源相关机遇（能效提升与成本节约、绿色金融低成本融资、品牌与市场空间、补贴与税收优惠政策红利）。财务影响涉及收入、支出、资产和负债、现金流四类。公司自身业务模式或所面临的政策环境、自然环境未发生重大变化的，无需每年开展评估工作。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第一章（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
  - standardDisclosureRequirementKey: energy_management.strategy.clean_energy_transition
    standardDisclosureRequirementTitle: 清洁能源使用与低碳转型安排
    excerptFrom: 上交所·指南第四号·披露要点2 清洁能源使用情况
    standardDisclosureRequirementText: 如涉及清洁能源、绿电、绿证或绿色电力交易信息，应说明清洁能源种类、使用或采购方式、总量、比例和应用场景。指南第四号披露要点2注2：公司可以自主披露国家电网采购电量中清洁能源的比例；绿证电量、企业单独采购或者自发自用的绿色电力等，能够反映清洁能源使用量的，公司可以披露上述能源的使用情况。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·披露要点2（指引第14号第三十五条）
    - standard: SZSE
      clauseRef: 第三十五条
    - standard: BSE
      clauseRef: 第三十五条
- topicSectionKey: energy_management.iro
  pillar: iro_management
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: energy_management.iro.saving_target_and_measures
    standardDisclosureRequirementTitle: 能源节约目标以及具体措施情况
    excerptFrom: 上交所·指南第四号·披露要点3 能源节约目标以及具体措施情况（第1、2项）
    standardDisclosureRequirementText: 1．能源节约目标，如总量目标或强度目标等。披露主体可以围绕能源消耗强度、能源利用效率、可再生能源占比等维度进行指标选取，比如单位营收/产品/产值综合能耗、综合能耗降低率、可再生能源使用量占总能耗的比例等；指标的选取可结合行业特点、企业实际运营情况以及相关的政策标准，以确保其具有针对性和可比性。2．具体节能措施，包括但不限于采购节能生产设备、节能照明设备、节能温控设备以及设备的节能改造，采用余热余压利用、能源梯级利用等措施；企业可以披露所采取的节能措施以及预计达到的成效。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·披露要点3（指引第14号第三十五条）
    - standard: SZSE
      clauseRef: 第三十五条
    - standard: BSE
      clauseRef: 第三十五条
  - standardDisclosureRequirementKey: energy_management.iro.policy_practice
    standardDisclosureRequirementTitle: 能源管理制度执行与闭环改进
    excerptFrom: 上交所·指南第四号·第三章（制度执行与管理措施）
    standardDisclosureRequirementText: 应依据治理模块提供的能源管理制度文件事实，按管理框架说明制度执行、能源计量、主要用能设备管理、节能降耗管控、数据跟踪和闭环改进。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第三章（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
  - standardDisclosureRequirementKey: energy_management.iro.operational_control
    standardDisclosureRequirementTitle: 主要用能环节运行控制
    excerptFrom: 上交所·指南第四号·披露要点3（措施类型“节能生产设备/技术应用”）
    standardDisclosureRequirementText: 应覆盖公司对主要用能设备和主要能源使用环节的运行控制，例如设备运行准则、操作人员培训、采购环节生命周期能效评价、设计阶段能源绩效改进机会、能源计量和监测。指南第四号披露要点3列举的措施类型包括节能生产设备（高效电机、变频器驱动的空压机水泵风机等关键动力设备）、节能照明设备、节能温控设备、余热余压回收、技术应用。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·披露要点3（指引第14号第三十四条、第三十五条）
    - standard: SZSE
      clauseRef: 第三十四条、第三十五条
    - standard: BSE
      clauseRef: 第三十四条、第三十五条
  - standardDisclosureRequirementKey: energy_management.iro.product_service_efficiency
    standardDisclosureRequirementTitle: 产品或服务节能增效案例
    excerptFrom: 上交所·指南第四号·第一章（能源相关机遇：产品及市场空间）
    standardDisclosureRequirementText: 如涉及产品或服务案例，应说明产品或服务内容、应用场景、帮助客户或社会实现节能降耗、提升能源利用效率或促进可再生能源使用的机制和效果。
    disclosureRequirementObligationLevel: conditional
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·第一章（指引第14号第三十五条）
    - standard: SZSE
      clauseRef: 第三十五条
    - standard: BSE
      clauseRef: 第三十五条
- topicSectionKey: energy_management.metrics
  pillar: metrics_targets
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: energy_management.metrics.energy_use_basics
    standardDisclosureRequirementTitle: 能源使用的基本情况
    excerptFrom: 上交所·指南第四号·披露要点1 能源使用的基本情况
    standardDisclosureRequirementText: 1．按类型划分的直接及间接能源（如煤、电、气或油）总能耗量（以吨标准煤计算）。2．能源结构。3．总能耗强度（如以营收、产量等单位计算）。指南第四号表5披露项包括直接能源消耗量、间接能源消耗量、能源消费总量（均以吨标煤计）与单位营收/产品/产值综合能耗，并须说明参数来源或依据。第二章明确综合能耗计算范围包括实际消耗的直接能源和间接能源，内部储存、转换及分配供应（含外销）过程中的能源损耗应当计入，需扣除能源加工转换产出的能源（如余热发电量）但余热发电系统的能源消耗需计入。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·披露要点1（指引第14号第三十五条）
    - standard: SZSE
      clauseRef: 第三十五条
    - standard: BSE
      clauseRef: 第三十五条
  - standardDisclosureRequirementKey: energy_management.metrics.clean_energy_usage
    standardDisclosureRequirementTitle: 清洁能源使用情况（种类、总量、比例）
    excerptFrom: 上交所·指南第四号·披露要点2 清洁能源使用情况
    standardDisclosureRequirementText: 风能、太阳能、水能、地热能、生物质资源、海洋能等清洁能源的种类、总量、比例等。其中，清洁能源比例可根据折标煤系数换算后统一计算。企业可以在表6基础上按照重要性原则进一步披露各类清洁能源的详细使用情况。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·披露要点2（指引第14号第三十五条）
    - standard: SZSE
      clauseRef: 第三十五条
    - standard: BSE
      clauseRef: 第三十五条
  - standardDisclosureRequirementKey: energy_management.metrics.targets_progress
    standardDisclosureRequirementTitle: 能源管理目标及报告期进展
    excerptFrom: 上交所·指南第四号·披露要点3（表7 节能减排目标示例：基准值、目标、报告期进展）
    standardDisclosureRequirementText: 如涉及能源管理目标和报告期进展，应说明具体定性或定量目标、不同阶段目标、报告期指标进展、是否完成目标、未完成原因或后续措施。指南第四号表7示例列示目标指标、单位、基准值、目标年度目标值与报告期进展。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第四号·披露要点3（指引第14号第三十五条）
    - standard: SZSE
      clauseRef: 第三十五条
    - standard: BSE
      clauseRef: 第三十五条
  - standardDisclosureRequirementKey: energy_management.metrics.energy_difficulty
    standardDisclosureRequirementTitle: 能源使用存在的具体困难
    excerptFrom: 上交所·指南第四号·披露要点3 能源节约目标以及具体措施情况（第3项）
    standardDisclosureRequirementText: 3．能源使用存在的具体困难（如有）。披露主体可以结合公司实际情况披露能源使用中存在的困难，如在能源供应集中度、稳定性、能源成本、能源管理与技术、人才与资金投入等方面存在的具体困难。
    disclosureRequirementObligationLevel: conditional
