- topicSectionKey: water_resource_management.metrics
  pillar: metrics_targets
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: water_resource_management.metrics.total_water_consumption
    standardDisclosureRequirementTitle: 总耗水量
    excerptFrom: 上交所·指南第五号·披露要点1 水资源使用的基本情况（第1项）
    standardDisclosureRequirementText: 1．总耗水量。披露主体应当披露总耗水量（以吨为单位）。耗水量是指在生产经营活动中，以各种形式消耗和损失而不能回归到地表水体或地下含水层的水量，一般可以通过取水量减去排水量计算。当排水量无实测数据或无法获得、统计成本较高时，企业可结合自身实际，核算并披露总取水量。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第五号·披露要点1（指引第14号第三十六条）
    - standard: SZSE
      clauseRef: 第三十六条
    - standard: BSE
      clauseRef: 第三十六条
    note: 准则内置替代口径：排水量无实测时可改披露总取水量，属合规的替代披露而非缺口。
  - standardDisclosureRequirementKey: water_resource_management.metrics.water_use_intensity
    standardDisclosureRequirementTitle: 水资源使用强度
    excerptFrom: 上交所·指南第五号·披露要点1 水资源使用的基本情况（第2项）
    standardDisclosureRequirementText: 2．水资源使用强度。披露主体应当披露水资源使用强度（如以每单位产品、每单位营收等计算）。对于产品类型相对集中的企业，可以披露单位产品用水强度；对于产品类型较为分散、产品多元或服务导向型企业，可以披露每单位营收用水强度。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 指南第五号·披露要点1（指引第14号第三十六条）
    - standard: SZSE
      clauseRef: 第三十六条
    - standard: BSE
      clauseRef: 第三十六条
  - standardDisclosureRequirementKey: water_resource_management.metrics.water_difficulty
    standardDisclosureRequirementTitle: 水资源使用存在的具体困难
    excerptFrom: 上交所·指南第五号·披露要点2 水资源节约目标以及具体措施情况（第4项）
    standardDisclosureRequirementText: 4．描述水资源使用存在的具体困难（如有）。应说明水资源使用存在的具体困难、形成原因、对公司运营或节水目标的影响以及后续应对计划。
    disclosureRequirementObligationLevel: conditional
