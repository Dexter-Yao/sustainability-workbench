    standardDisclosureRequirementTitle: 源头预防、过程控制与责任延伸
    excerptFrom: 参考模板“源头预防、过程控制、供应链责任延伸、末端可追溯管理”
    standardDisclosureRequirementText: 可进一步披露说明前端预防性嵌入、过程系统性控制、产品报废回收路径、绿色运输、隐患汇总表、整改追踪和持续改进机制。
    disclosureRequirementObligationLevel: encouraged
