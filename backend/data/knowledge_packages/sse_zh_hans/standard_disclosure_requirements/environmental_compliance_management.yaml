      clauseRef: 第二十九条
    - standard: SZSE
      clauseRef: 第二十九条
    - standard: BSE
      clauseRef: 第二十九条
  - standardDisclosureRequirementKey: environmental_compliance_management.gov.certifications_required
    standardDisclosureRequirementTitle: 环境管理体系认证情况
    excerptFrom: 参考模板“公司环境管理体系认证情况”
    standardDisclosureRequirementText: 如涉及环境管理体系认证或其他环境合规认证信息，应说明认证名称、适用标准、覆盖范围、有效期或报告期内复审情况。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 第二十九条
    - standard: SZSE
      clauseRef: 第二十九条
    - standard: BSE
      clauseRef: 第二十九条
  - standardDisclosureRequirementKey: environmental_compliance_management.gov.certifications_encouraged
    standardDisclosureRequirementTitle: 认证覆盖与标准化体系运行
    excerptFrom: 参考模板“依照适用标准搭建全流程环境管控体系”
    standardDisclosureRequirementText: 可进一步披露说明认证适用标准、覆盖业务或运营场所、证书有效期、复审安排、标准化运行机制和认证对环境管理长效化的作用；证书编号、机构名称、覆盖比例和有效期必须来自相关事实。
    disclosureRequirementObligationLevel: encouraged
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 第二十九条
    - standard: SZSE
      clauseRef: 第二十九条
    - standard: BSE
      clauseRef: 第二十九条
  - standardDisclosureRequirementKey: environmental_compliance_management.gov.responsibility_matrix_required
    standardDisclosureRequirementTitle: 环境合规责任分工
    excerptFrom: 附录索引表第二十九条；参考模板“矩阵式职责架构”
    standardDisclosureRequirementText: 应说明环境合规管理的责任部门、执行单位、职责边界或业务协同方式。
