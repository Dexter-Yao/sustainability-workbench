    standardDisclosureRequirementTitle: 矩阵式职责架构与业务协同
    excerptFrom: 参考模板“纵向贯通、横向协同的矩阵式管理架构”
    standardDisclosureRequirementText: 可进一步披露说明矩阵式职责架构、纵向归口管理、横向业务协同、研发源头管控、供应链环保责任延伸和生产运营执行主体。
