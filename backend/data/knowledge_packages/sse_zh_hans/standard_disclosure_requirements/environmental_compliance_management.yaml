- topicSectionKey: environmental_compliance_management.strategy
  pillar: strategy
  standardDisclosureRequirements:
  - standardDisclosureRequirementKey: environmental_compliance_management.strategy.targets_required
    standardDisclosureRequirementTitle: 环境合规战略、策略与目标
    excerptFrom: 参考模板“公司环境合规管理战略、策略和目标内容”
    standardDisclosureRequirementText: 应说明公司环境合规管理的战略、策略或目标，包括对标环保法律法规、污染物达标排放、厂区噪声治理、固体废弃物规范化管理、环境风险排查、管控机制或合法合规运营方向；量化目标和完成进度必须来自相关事实。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 第二十九条
    - standard: SZSE
      clauseRef: 第二十九条
    - standard: BSE
      clauseRef: 第二十九条
  - standardDisclosureRequirementKey: environmental_compliance_management.strategy.targets_encouraged
    standardDisclosureRequirementTitle: 环境风险管控与合规运营目标
    excerptFrom: 参考模板“建立长效环境风险排查与管控机制”
    standardDisclosureRequirementText: 可进一步披露说明环境合规目标与业务运营、污染防治、噪声治理、废弃物规范处置、在线监测、现场核查、数据复盘或风险管控机制的衔接。
    disclosureRequirementObligationLevel: encouraged
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 第二十九条
    - standard: SZSE
      clauseRef: 第二十九条
    - standard: BSE
      clauseRef: 第二十九条
  - standardDisclosureRequirementKey: environmental_compliance_management.strategy.lifecycle_control_required
    standardDisclosureRequirementTitle: 全生命周期环境合规管控
    excerptFrom: 附录索引表第二十九条；参考模板“全流程嵌入与系统性管控”
    standardDisclosureRequirementText: 应说明公司如何将生态环境保护和环境合规要求嵌入研发、建设、生产、供应链、运营或产品全生命周期，包括环保三同时、环境因素识别、供应商和承包商环保评估、污染防治、废弃物或排放标准化处置。
    disclosureRequirementObligationLevel: required
    sourceClauseReferenceLabels:
    - standard: SSE
      clauseRef: 第二十九条
    - standard: SZSE
      clauseRef: 第二十九条
    - standard: BSE
      clauseRef: 第二十九条
