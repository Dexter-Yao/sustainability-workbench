      clauseRef: 第二十九条
  - standardDisclosureRequirementKey: environmental_compliance_management.gov.management_system_encouraged
    standardDisclosureRequirementTitle: 环境管理体系认证与制度评价
    excerptFrom: 参考模板“ISO 14001 环境管理体系认证、合规性评估”
    standardDisclosureRequirementText: 可进一步披露说明 ISO 14001 或同类环境管理体系认证、覆盖运营场所比例、制度执行性评价、内部审核、管理评审、纠正预防和持续改进安排。
    disclosureRequirementObligationLevel: encouraged
