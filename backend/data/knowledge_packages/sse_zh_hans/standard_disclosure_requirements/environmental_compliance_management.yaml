    standardDisclosureRequirementTitle: 环境管理体系与运行控制
    excerptFrom: 附录索引表第二十九条；参考模板“环境合规管理”
    standardDisclosureRequirementText: 应说明公司是否建立环境管理体系、环境管理制度、环境因素识别、合规性评价、监督考核或“识别—管控—监督—改进”的闭环机制。
    disclosureRequirementObligationLevel: required
