    standardDisclosureRequirementText: 可进一步披露说明 IT 设备升级改造与再利用、塑料回料自循环利用、包装纸箱改周转箱、固废分类台账、循环经济数字化管理等案例。
    disclosureRequirementObligationLevel: encouraged
