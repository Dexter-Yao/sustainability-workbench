content:
  generated:
    company_intro.body: 晟原精密电子股份有限公司是以精密电子元器件为核心的制造企业，业务涵盖连接器、精密结构件与电子模组。公司构建了覆盖研发、制造、销售与服务的业务体系，持续推进产品创新、数字化制造与绿色低碳转型。
    gov.structure_intro: 晟原精密建立了由股东大会、董事会、监事会和高级管理层组成的公司治理架构。股东大会作为最高权力机构，依法决定公司经营方针、投资计划以及董事、监事选举等重大事项；董事会对股东大会负责，承担经营计划、投资方案、内部管理机构设置和基本管理制度等职责；监事会依法对董事、高级管理人员履职及公司财务情况进行监督；高级管理层负责日常经营管理并组织实施董事会决议。各治理主体依照章程履行职责，保障公司治理运行有序。
    sm.gov_arch_overview: 晟原精密结合精密电子制造业务特点，建立由董事会关注、管理层统筹、可持续发展相关部门协调、各职能部门和业务单位共同参与的可持续发展治理架构。董事会关注可持续发展重大事项，管理层统筹年度重点工作，可持续发展相关部门负责议题协调、信息收集与报告编制，各职能部门和业务单位结合实际落实环境、员工、供应链、合规等相关工作，推动可持续发展要求融入日常管理。
    climate.gov_structure: 公司高度重视气候相关治理，构建了"决策监督—统筹执行—专项落实"三层治理架构。可持续发展委员会作为最高决策与监督机构，审议气候战略、目标与重大风险应对；可持续发展办公室作为统筹执行中枢，协调各部门推进气候相关工作；气候行动管理组负责具体措施落实与数据归集。三层之间建立常态化协同与汇报机制，并持续开展面向管理层与业务团队的气候相关能力培训，提升全员应对气候变化的专业水平。
    climate.iro_reduction_practice: 公司实施多项节能减排与资源循环措施，涵盖节能技改、分布式光伏等清洁能源替代与工艺优化降耗，并推进废料循环利用，围绕单位产值碳强度下降方向持续推进，报告期内取得阶段性成效。
    climate.iro_training: 公司面向管理层与一线业务团队开展应对气候变化专项培训，覆盖低碳政策、碳核算与减排实务等主题，提升全员气候素养与执行能力。
