# ABOUTME(en): Deterministic stakeholder engagement catalog of the GRI English package: stable stakeholder types,
# ABOUTME(en): engagement methods and the default topic ↔ stakeholder mapping. Topic names
# ABOUTME(en): and applicability stay with topic_registry.yaml; this file only references official topic ids.

stakeholders:
  - id: government_regulators
    label: Government and regulators
    order: 10
    defaultMethodIds: [regulatory_communication, document_submission_correspondence, supervision_inspection_support]
  - id: shareholders_investors
    label: Shareholders and investors
    order: 20
    defaultMethodIds: [shareholder_meeting, information_disclosure, investor_communication]
  - id: customers
    label: Customers
    order: 30
    defaultMethodIds: [customer_visits, customer_service_channels, satisfaction_survey, complaints_feedback]
  - id: management
    label: Management
    order: 40
    defaultMethodIds: [management_meeting, special_reporting, issue_review_decision]
  - id: employees
    label: Employees
    order: 50
    defaultMethodIds: [employee_representative_communication, employee_forum, opinion_channels, training]
  - id: suppliers
    label: Suppliers
    order: 60
    defaultMethodIds: [supplier_meeting, daily_business_communication, supplier_admission_evaluation, supply_chain_collaborative_improvement]
  - id: partners
    label: Business partners
    order: 70
    defaultMethodIds: [business_meeting, industry_exchange, joint_working_group, project_cooperation]
  - id: community_public
    label: Community and the public
    order: 80
    defaultMethodIds: [community_visits, public_consultation, opinion_solicitation, community_co_creation]

methods:
  - {id: regulatory_communication, label: Regulatory communication, kind: communication_channel, allowedStakeholderTypes: [government_regulators]}
  - {id: document_submission_correspondence, label: Filings and correspondence, kind: communication_channel, allowedStakeholderTypes: [government_regulators]}
  - {id: policy_briefing_roundtable, label: Policy briefings and roundtables, kind: participation_mechanism, allowedStakeholderTypes: [government_regulators]}
  - {id: supervision_inspection_support, label: Cooperation with inspections, kind: participation_mechanism, allowedStakeholderTypes: [government_regulators]}
  - {id: government_enterprise_exchange, label: Government–business exchange, kind: collaboration_activity, allowedStakeholderTypes: [government_regulators]}

  - {id: shareholder_meeting, label: General meetings, kind: communication_channel, allowedStakeholderTypes: [shareholders_investors]}
  - {id: information_disclosure, label: Announcements and disclosures, kind: communication_channel, allowedStakeholderTypes: [shareholders_investors]}
  - {id: investor_communication, label: Investor communication, kind: communication_channel, allowedStakeholderTypes: [shareholders_investors]}
  - {id: inquiries_feedback, label: Enquiries and feedback, kind: participation_mechanism, allowedStakeholderTypes: [shareholders_investors]}
  - {id: thematic_exchange, label: Thematic exchanges, kind: collaboration_activity, allowedStakeholderTypes: [shareholders_investors]}

  - {id: customer_visits, label: Customer visits, kind: communication_channel, allowedStakeholderTypes: [customers]}
  - {id: customer_service_channels, label: Customer service hotline and online channels, kind: communication_channel, allowedStakeholderTypes: [customers]}
  - {id: satisfaction_survey, label: Satisfaction surveys, kind: participation_mechanism, allowedStakeholderTypes: [customers, employees]}
