      answer: The Board holds ultimate responsibility for environmental, social and governance matters and reviews the related risks, targets and progress at least twice a year; the ESG working group, led by an executive director, reports to the Board.
    board_statement.q_management_approach:
      answer: The Board has set a management approach built on compliant operation, green manufacturing and a people-first culture; material issues are identified and ranked through an annual stakeholder questionnaire and a management assessment, and disclosure priorities follow their importance to the business and to stakeholders.
    board_statement.q_progress_review:
      answer: The Board reviews progress against the energy intensity, greenhouse gas emission intensity and injury rate targets every year and adjusts the targets as the business develops.
    sustainability_governance_structure:
      answer: The company has an ESG working group led by an executive director, with the heads of finance, human resources, production, quality and procurement as members; each department appoints a coordinator responsible for data collection.
    sustainability_governance_duties:
      answer: The Board oversees and approves; the working group coordinates the materiality assessment, target setting and report preparation; departments implement the measures and submit data quarterly.
