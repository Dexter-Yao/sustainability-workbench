# ABOUTME(en): Source of the appendix GRI content index: the GRI disclosures this report cites → the report
# ABOUTME(en): sections where each is found. Required by GRI 1 Foundation 2021 for reporting with reference.
# Only disclosures actually cited belong here: with reference sets no minimum number, and an uncited
# disclosure is simply absent from the index rather than listed as an omission.
chapters:
  - title: GRI 2 General Disclosures 2021
    sections:
      - title: The organization and its reporting practices
        clauses:
          - {clause: "2-1 Organizational details", reportSections: [About the Company]}
          - {clause: "2-2 Entities included in the organization's sustainability reporting", reportSections: [Reporting Boundary]}
          - {clause: "2-3 Reporting period, frequency and contact point", reportSections: [Time Frame, Report Access and Feedback]}
          - {clause: "2-5 External assurance", reportSections: [Report Assurance]}
      - title: Activities and workers
        clauses:
          - {clause: "2-6 Activities, value chain and other business relationships", reportSections: [About the Company]}
          - {clause: "2-7 Employees", reportSections: [Employment]}
      - title: Governance
        clauses:
          - {clause: "2-9 Governance structure and composition", reportSections: [Governance Structure and Accountability]}
          - {clause: "2-12 Role of the highest governance body in overseeing the management of impacts", reportSections: [Board Statement]}
          - {clause: "2-13 Delegation of responsibility for managing impacts", reportSections: [Sustainability Governance Structure]}
          - {clause: "2-14 Role of the highest governance body in sustainability reporting", reportSections: [Board Statement]}
      - title: Strategy, policies and practices
