# ABOUTME(en): Topic chapter template of the GRI topic "Biodiversity" (GRI 101: Biodiversity 2024): management /
# ABOUTME(en): approach / actions blocks with their intake evidence and GRI requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: biodiversity
  title: Biodiversity
  headingLevel: 2
  reportSectionId: biodiversity
  conciseDisclosure:
    id: biodiversity.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this topic, write one coherent summary covering the policies to halt and reverse biodiversity loss, how biodiversity impacts are managed and where they occur, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: biodiversity.gov
    title: Management of the Topic
    pillar: governance
    headingLevel: 3
    blocks:
    - id: biodiversity.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe how the company manages biodiversity: the policies and commitments to halt and reverse biodiversity loss, and the responsibilities for them.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 220
        - 420
        standardDisclosureRequirementKeys:
        - biodiversity.gov.policies
  - key: biodiversity.strategy
    title: Approach and Targets
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: biodiversity.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's direction and targets for biodiversity: how biodiversity impacts are identified, and the goals and targets set for managing them.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 200
        - 400
        standardDisclosureRequirementKeys:
        - biodiversity.strategy.identification
  - key: biodiversity.iro
    title: Actions and Processes
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: biodiversity.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the actions the company takes on biodiversity: the mitigation hierarchy applied to manage impacts, and the arrangements at sites near or in areas of biodiversity importance.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 240
        - 460
        standardDisclosureRequirementKeys:
        - biodiversity.iro.management
metricDisclosure:
  catalogMetricKeys: []
