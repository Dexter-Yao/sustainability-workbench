# ABOUTME(en): Topic chapter template of the GRI topic "Customer Health and Safety" (GRI 416: Customer Health and Safety 2016): management /
# ABOUTME(en): approach / actions blocks with their intake evidence and GRI requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: customer_health_and_safety
  title: Customer Health and Safety
  headingLevel: 2
  reportSectionId: customer_health_and_safety
  conciseDisclosure:
    id: customer_safety.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this topic, write one coherent summary covering how product and service health and safety impacts are assessed and managed, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: customer_health_and_safety.gov
    title: Management of the Topic
    pillar: governance
    headingLevel: 3
    blocks:
    - id: customer_safety.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe how the company manages customer health and safety: the responsibilities and policies covering the health and safety of its products and services.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 220
        - 420
        standardDisclosureRequirementKeys:
        - customer_health_and_safety.gov.management_of_customer_safety
  - key: customer_health_and_safety.strategy
    title: Approach and Targets
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: customer_safety.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's direction and targets for customer health and safety, including the approach to assessing health and safety impacts across its product and service categories.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 200
        - 400
        standardDisclosureRequirementKeys:
        - customer_health_and_safety.strategy.impact_assessment
  - key: customer_health_and_safety.iro
    title: Actions and Processes
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: customer_safety.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the actions and processes the company applies to customer health and safety: quality control, recall and complaint handling arrangements, and how non-compliance is prevented.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 240
        - 460
        standardDisclosureRequirementKeys:
        - customer_health_and_safety.iro.non_compliance
metricDisclosure:
