# ABOUTME(en): Topic chapter template of the GRI topic "Customer Privacy" (GRI 418: Customer Privacy 2016): management /
# ABOUTME(en): approach / actions blocks with their intake evidence and GRI requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: customer_privacy
  title: Customer Privacy
  headingLevel: 2
  reportSectionId: customer_privacy
  conciseDisclosure:
    id: privacy.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this topic, write one coherent summary covering how customer privacy and data are protected and how complaints and breaches are handled, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: customer_privacy.gov
    title: Management of the Topic
    pillar: governance
    headingLevel: 3
    blocks:
    - id: privacy.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe how the company manages customer privacy: the responsibilities and policies covering the collection, use and protection of customer data.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 220
        - 420
        standardDisclosureRequirementKeys:
        - customer_privacy.gov.management_of_privacy
  - key: customer_privacy.strategy
    title: Approach and Targets
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: privacy.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's direction and targets for customer privacy, including the approach to protecting customer data as the business and its systems develop.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 200
        - 400
        standardDisclosureRequirementKeys:
        - customer_privacy.strategy.privacy_direction
  - key: customer_privacy.iro
    title: Actions and Processes
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: privacy.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the actions and processes the company applies to customer privacy: access control, staff arrangements, and how privacy complaints and data breaches are handled.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 240
        - 460
        standardDisclosureRequirementKeys:
        - customer_privacy.iro.complaints_and_breaches
metricDisclosure:
  catalogMetricKeys:
  - privacy_data_breaches
