# ABOUTME(en): Topic chapter template of the GRI topic "Waste" (GRI 306: Waste 2020): management /
# ABOUTME(en): approach / actions blocks with their intake evidence and GRI requirement keys; the metrics H3 is compiled from metricDisclosure.
section:
  key: waste
  title: Waste
  headingLevel: 2
  reportSectionId: waste
  conciseDisclosure:
    id: waste.concise_summary
    type: paragraph
    blockType: generative
    source: ai
    styleRole: body
    generation:
      task:
        focus: |-
          From the evidence currently visible for this topic, write one coherent summary covering the waste-related impacts, how they are managed and the waste data reported, without the four sub-headings.
      inputs:
        evidence:
          kind: report_section
      targetChars:
      - 260
      - 520
  children:
  - key: waste.gov
    title: Management of the Topic
    pillar: governance
    headingLevel: 3
    blocks:
    - id: waste.gov_policy
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe how the company manages waste: the responsibilities and policies in place, and the inputs, activities and outputs that lead or could lead to significant waste-related impacts.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 220
        - 420
        standardDisclosureRequirementKeys:
        - waste.gov.generation_and_impacts
  - key: waste.strategy
    title: Approach and Targets
    pillar: strategy
    headingLevel: 3
    blocks:
    - id: waste.strategy_direction
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the company's direction and targets for waste: the actions taken to prevent waste generation in its own activities and in the value chain, and the circularity measures it pursues.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 200
        - 400
        standardDisclosureRequirementKeys:
        - waste.strategy.prevention_measures
  - key: waste.iro
    title: Actions and Processes
    pillar: iro_management
    headingLevel: 3
    blocks:
    - id: waste.iro_measures
      type: paragraph
      blockType: generative
      source: ai
      styleRole: body
      generation:
        task:
          focus: |-
            Describe the actions and processes the company applies to waste: how third-party waste management is handled and how waste data are collected and monitored.
          noFactGuidance: |-
            When the user provides no facts for this part, keep a prudent, general and low-commitment register describing the management attention and directional arrangements common to the industry; do not claim that specific systems, projects, certifications or results are in place.
        inputs:
          evidence:
            kind: report_section
        targetChars:
        - 240
        - 460
        standardDisclosureRequirementKeys:
        - waste.iro.third_party_and_data
metricDisclosure:
  catalogMetricKeys:
  - waste_hazardous_total
  - waste_hazardous_intensity
  - waste_non_hazardous_total
  - waste_non_hazardous_intensity
  - waste_recycled_total
  - waste_recycling_rate
