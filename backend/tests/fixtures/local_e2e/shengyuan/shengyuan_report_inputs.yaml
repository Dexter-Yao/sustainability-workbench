- target_key: company_profile
  answer: '晟原精密电子股份有限公司成立于 2008 年，是一家专注于精密电子元器件与连接器研发、制造与销售的企业，注册地与主生产基地均位于江苏省苏州市工业园区。公司成立初期以消费电子领域的精密冲压端子加工起步，2012
    年前后建立自有模具开发能力，逐步由来料加工转向自主设计制造。2015 年起顺应下游电动化趋势进入新能源汽车零部件配套领域，2019 年通过 IATF 16949
    汽车质量管理体系认证，形成消费电子与新能源汽车并重的业务结构。


    公司现有产品覆盖高速连接器、精密冲压端子与结构件三条产品线，应用于消费电子、新能源汽车与工业控制领域。其中消费电子与新能源汽车为两大主要应用市场，合计约占营业收入的
    75%，工业控制及其他应用约占 25%。客户群体主要为境内外整机厂与车企一级供应商，区域覆盖华东、华北与珠三角等制造业集聚区；2025 年度活跃客户约 68
    家，前三大客户营业收入贡献度约 26%，客户集中度相对均衡。


    公司核心能力集中在精密模具开发与高一致性批量制造：设有产品研发中心与工艺创新中心，配备模具研发实验室与连接器性能测试室，具备尺寸检测、盐雾试验、插拔寿命等检验能力。截至
    2025 年末在册员工 860 人，其中研发团队约 90 人；2025 年研发投入 3,900 万元，重点投向新能源汽车用高温高可靠性连接器与精密冲压工艺自动化。


    公司已建立并持续运行 ISO 9001 质量管理体系、ISO 14001 环境管理体系、ISO 45001 职业健康安全管理体系与 IATF 16949 汽车质量管理体系。公司秉持精密制造与绿色低碳并重的经营理念，在满足客户质量与交付要求的同时，推进能源效率提升、废弃物资源化与供应链可持续管理。'
