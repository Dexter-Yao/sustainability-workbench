- target_key: company_profile
  answer: '晉澧精密工業控股有限公司於 2006 年在香港成立，2016 年於香港聯合交易所主板上市，是一家專注於精密金屬沖壓件、連接器及組裝模組研發、製造及銷售的製造企業。公司總部位於香港觀塘，生產基地位於廣東省東莞市松山湖園區，由全資附屬公司東莞晉澧精密電子有限公司持有及營運。截至
    2025 年 12 月 31 日，集團僱員 612 人。


    公司產品分為精密金屬沖壓件、連接器及組裝模組三類，應用於消費電子、工業設備及新能源汽車零部件領域；2025 年度營業收入 486.2 百萬港元，其中消費電子約佔
    46%，新能源汽車零部件約佔 33%，工業設備及其他約佔 21%。公司具備精密級進模開發、高速沖壓與在線檢測及熱處理配套能力，東莞廠區沖壓車間自動化率約 68%，屋頂光伏
    1.2 MWp 於 2023 年 6 月投運。


    公司持有 ISO 9001、ISO 14001、ISO 45001 及 IATF 16949 認證，研發及工程人員約 86 人，2025 年研發開支約 21.4
    百萬港元。公司以「精密製造、穩健經營、以人為本」為經營理念，推進節能減排、廢棄物資源化與供應鏈協同，重視僱員發展、產品責任及社區參與。'
  expected_definition_fingerprint: e8d35357671536a46366f3ff71711c607670b6d09a9acfb78b671cc229ac17f1
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
