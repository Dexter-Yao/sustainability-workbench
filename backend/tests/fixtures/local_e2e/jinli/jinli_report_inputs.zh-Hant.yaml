  answer: 董事會對集團的環境、社會及管治事宜負最終責任，包括釐定管理方針及策略、審批重要性評估結果、審批目標並檢討進度、審批年度報告。2025 年董事會兩次專項審議相關事宜（3
    月審議 2024 年度報告及重要性評估結果，9 月檢討目標進度及氣候情景分析）。日常管理授權予由執行董事兼財務總監牽頭的環境、社會及管治工作小組，小組每季開會，每半年向董事會提交書面匯報，重大事項須於
    2 個工作日內向主席及行政總裁報告。
