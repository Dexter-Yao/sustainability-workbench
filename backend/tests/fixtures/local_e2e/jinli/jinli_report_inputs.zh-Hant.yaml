- target_key: board_statement.q_management_approach
  answer: 董事會確立以「合規營運、綠色製造、以人為本」為主軸的管理方針。重要議題每年透過三步識別及排序：以守則各層面及氣候相關披露為基礎形成 16 項議題清單；2025
    年 10 月向僱員、客戶、供應商及投資者發出持份者問卷（回收 312 份）評估對持份者的重要性；11 月由工作小組及部門主管就對業務的重要性（收入、成本、合規及聲譽，綜合短、中、長期）評分，兩軸均以
    4.0 分為閾值。結果 8 項議題屬高度重要，經董事會於 12 月審閱。氣候相關風險納入集團年度風險登記冊，由審核委員會檢討。
