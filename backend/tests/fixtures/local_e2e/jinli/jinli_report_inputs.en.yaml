- target_key: company_profile
  answer: 'Jinli Precision Industrial Holdings Limited was founded in Hong Kong in
    2006 and listed on the Main Board of The Stock Exchange of Hong Kong Limited in
    2016. It develops, manufactures and sells precision metal stamping parts, connectors
    and assembled modules. The head office is in Kwun Tong, Hong Kong, and the production
    base in Songshan Lake, Dongguan, Guangdong, is held and operated by the wholly
    owned subsidiary Dongguan Jinli Precision Electronics Co., Ltd. The group employed
    612 people as at 31 December 2025.


    Products fall into three lines — precision metal stamping parts, connectors and
    assembled modules — serving consumer electronics, industrial equipment and new
    energy vehicle component customers. Revenue for 2025 was HK$486.2 million, of
    which consumer electronics accounted for about 46%, new energy vehicle components
    about 33% and industrial equipment and others about 21%. The company runs precision
    progressive die development, high-speed stamping with in-line inspection and in-house
    heat treatment; the Dongguan stamping shop is about 68% automated and a 1.2 MWp
    rooftop solar system has operated since June 2023.


    The company holds ISO 9001, ISO 14001, ISO 45001 and IATF 16949 certifications,
    employs about 86 research and engineering staff and spent about HK$21.4 million
    on research and development in 2025. Guided by precision manufacturing, prudent
    operation and a people-first culture, it advances energy saving, waste recovery
    and supply chain collaboration and values employee development, product responsibility
    and community participation.'
  expected_definition_fingerprint: cb78b7647d7445bcd2556e2182bf2eabcb8f107b2c9d9e38b862e2b919331b96
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
