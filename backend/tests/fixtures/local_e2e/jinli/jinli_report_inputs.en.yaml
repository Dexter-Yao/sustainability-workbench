- target_key: board_statement.q_oversight
  answer: 'The Board holds ultimate responsibility for environmental, social and governance
    matters, including setting the management approach and strategy, approving the
    materiality assessment results, approving targets and reviewing progress, and
    approving the annual report. In 2025 the Board considered these matters at two
    dedicated sessions (March: the 2024 report and materiality results; September:
    target progress and the climate scenario analysis). Day-to-day management is delegated
    to the ESG working group led by the executive director and chief financial officer,
    which meets quarterly, reports to the Board in writing every half year and must
    report material matters to the Chairman and the Chief Executive within two working
    days.'
  expected_definition_fingerprint: 30bd2dc42589456f26ace2c0b0a84f93e81962f397e60b645a20b2213f65065d
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
- target_key: board_statement.q_management_approach
  answer: 'The Board has set a management approach built on compliant operation, green
    manufacturing and a people-first culture. Material issues are identified and ranked
    each year in three steps: a list of 16 topics built from the Aspects of the Code
    and the climate-related disclosures; a stakeholder questionnaire in October 2025
    (312 responses from employees, customers, suppliers and investors) assessing importance
    to stakeholders; and a management workshop in November in which the working group
    and department heads scored importance to the business (revenue, cost, compliance
    and reputation over the short, medium and long term), with a threshold of 4.0
    on both axes. Eight topics were highly material and the Board reviewed the results
    in December. Climate-related risks are entered in the group risk register reviewed
    by the Audit Committee.'
  expected_definition_fingerprint: 99d2739f4946c23e0cc5cc55cd5628ae40414d6a02eeeb75cf3e624de04dc383
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
- target_key: board_statement.q_progress_review
  answer: 'In 2024 the Board approved three quantified targets and reviews progress
    every September: a 30% reduction in Scope 1 and Scope 2 greenhouse gas emission
    intensity by 2030 against 2023 (16.6 tCO2e per HK$ million in 2025, down 22.4%);
    a 15% reduction in energy consumption intensity by 2027 against 2023 (38.9 MWh
    per HK$ million in 2025, down 13.2%); and no more work injury cases than the previous
    year (7 in 2025 against 9 in 2024). Emission and energy intensity bear directly
    on electricity costs and customers'' carbon footprint requirements, and the injury
    rate on production continuity and employee retention; the Board may adjust the
    targets as the business develops.'
  expected_definition_fingerprint: 6f1b3c655594abe3c19b639115d6f1771777c457cc6880f97859cd0f2f3cbff0
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
- target_key: sustainability_governance_structure
  answer: 'Environmental, social and governance matters are managed at three levels:
    the Board, the ESG working group and departmental coordinators. The Board holds
    ultimate responsibility and receives a written report every half year. The working
    group, formed in 2021 with terms of reference JL-GOV-001, is led by the executive
    director and chief financial officer Wong Chung-yan and comprises the Dongguan
    plant general manager Chow Kai-ming, the EHS manager Law Tsz-hin, the production
    manager Ng Chi-keung, the quality manager Cheung Wing-lok, the procurement manager
    Fung Ka-yan, the human resources manager Li Wai-shan, the IT manager Kwok Chun-kit
    and the sales and customer service manager Ko Mei-ling, with the company secretary
    Tam Wing-sze as secretary; it meets quarterly and met four times in 2025. Each
    department appoints a coordinator who submits data and progress quarterly.'
  expected_definition_fingerprint: 81d847b0e85686b741e7cb84a6a3408226e374fc0505a25490eaedd8bfcf07c6
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
- target_key: sustainability_governance_duties
  answer: The Board approves the management approach, targets and annual report and
    reviews target progress. The working group coordinates the materiality assessment,
    target allocation and tracking, climate risk assessment, data consolidation and
    review, and report preparation, and reviews the making and revision of related
    policies. The EHS department owns emissions, waste, energy, water and occupational
    safety data; human resources owns employment, training, labour standards and community
    investment; procurement owns supply chain management and supplier evaluation;
    quality and sales and customer service own product responsibility and complaints;
    IT owns data protection; and the company secretary's office owns anti-corruption,
    compliance and Board reporting. Data are signed off by department heads, environmental
    and safety data are reviewed by the EHS manager and the rest by the company secretary.
  expected_definition_fingerprint: 3e2f034f44ef6edf4b7315ac36e1014724f9765f6102965c4a91ed77810b8621
  expected_target_fingerprint: 3f86ae4459659e8a75ef3b0362b8a37af74229b6919995041e25122584496336
