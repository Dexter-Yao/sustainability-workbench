[project]
name = "sustainability-desk-backend"
version = "0.1.0"
description = "可持续披露报告编制工作台后端"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.4.0",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi>=0.137.1",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1",
    "pydantic>=2",
    "pydantic-ai-slim[openai]>=2.1.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.14,<7",
    "pillow>=12.2,<13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.49.0",
    "python-pptx>=1.0.2",
    "rapidocr==3.9.2",
    "onnxruntime>=1.28,<2",
    "omegaconf>=2.3,<3",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# rapidocr 声明依赖 opencv-python，其 wheel 需要桌面 GUI 系统库（libGL 等），
# 无 GUI 的生产主机无法安装。override-dependencies 让 opencv-python-headless
# 在整个解析图中顶替 opencv-python，任何依赖方都不会再拉取桌面版 OpenCV。
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sustainability_desk"]
