# ABOUTME: CI 跑不依赖本机栈的部分：前端全量、后端非持久化非导出用例、两个 lint。
# ABOUTME: 持久化用例需要 Supabase 栈、导出用例需要完整 LibreOffice，两者按 SETUP.md 在本机跑。
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # 占位凭据：只为让模型对象能构造出来。受此影响的用例只断言 Agent 未暴露
      # 领域改写工具（tests/test_material_mapping_agent.py），不发出任何请求。
      # 真实调用的用例本就不在 CI 跑。
      AZURE_OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AZURE_OPENAI_ENDPOINT: https://example.invalid/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --project backend
      - name: pytest
        working-directory: backend
        # 跳过 Word 导出用例：它们走 render_final_docx，末尾无条件调用
        # finalize_toc_page_numbers——目录页码要靠排版引擎真跑一遍分页才算得出。
        # 两种 runner 配置都不成立（均为 CI 实测）：不装 LibreOffice 报
        # 「未安装 LibreOffice」；装 libreoffice-writer 则 headless 排不出正文
        # 第 1 页，报「未找到正文第 1 页」。导出保真是一级风险，必须在装有完整
        # LibreOffice 的本机按 SETUP.md 验，CI 不具备该能力也不假装具备。
        # 持久化用例另有 pytest.skip("本地 Supabase 栈未启动")，同样不假装验过。
        run: uv run pytest -q --ignore=tests/test_docx_render.py
      - name: ruff
        run: uv run --project backend ruff check backend/src backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
