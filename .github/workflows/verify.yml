# ABOUTME: CI 只跑不依赖数据库与模型的部分：前端全量、后端非持久化用例、两个 lint。
# ABOUTME: 持久化与导出用例需要本机 Supabase 栈与 LibreOffice，按 SETUP.md 在本机跑。
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        # Word 导出的运行时依赖：目录页码要靠排版引擎分页，python-docx 不做排版。
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer
      - run: uv sync --project backend
      - name: pytest
        working-directory: backend
        # 持久化用例在无 Supabase 栈时自行 skip；此处不假装它们跑过。
        run: uv run pytest -q
      - name: ruff
        run: uv run --project backend ruff check backend/src backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
